version: 3
purpose: "Testagram-owned backend capabilities with official self-hosted Supabase retained as the core"
policy:
  ownership: "Testagram owns runtime, media, video, data, keys, queues, orchestration and operational control"
  upstream_boundary: "Official Supabase source and self-hosted Docker distribution remain unmodified"
  no_managed_dependency_required: true

supabase_core:
  source: "supabase/supabase self-hosted Docker distribution"
  capabilities:
    - auth
    - postgres
    - rest
    - realtime
    - storage
    - edge_functions
    - postgres_meta
    - connection_pooling
    - optional_logs_and_analytics
    - optional_vector
    - optional_queues

testagram_owned_services:
  identity:
    implementation: "Supabase Auth plus Testagram authorization/RLS/session policy"
    external_dependency: false
  video_platform:
    implementation: "Testagram-owned creator channels, upload, local media storage, FFmpeg processing, HLS playback, posters, visibility, likes, views and publishing"
    external_dependency: false
  media:
    implementation: "local object-storage pipeline, image/video transforms, thumbnails and signed delivery URLs"
    external_dependency: false
  push:
    implementation: "local notification broker with device registry, durable queue, templates and preferences"
    external_dependency: false
  edge_network:
    implementation: "local reverse proxy, TLS, rate limiting, WAF policy, caching and origin routing"
    external_dependency: false
  cache_queue:
    implementation: "local Redis-compatible cache and durable job queues"
    external_dependency: false
  identity_verification:
    implementation: "KYC orchestration, evidence vault, verification state machine and audit trail"
    external_dependency: false
  payments:
    implementation: "payment ledger, idempotency, webhooks, reconciliation, fees, payouts and provider adapters"
    external_dependency: true
    providers: [mpesa, paypal, pesapal]
  content_discovery:
    implementation: "local GIF index, news/feed normalization, RSS ingestion and moderation pipeline"
    external_dependency: false
  federation:
    implementation: "ActivityPub/Mastodon federation service and Matrix bridge"
    external_dependency: false
    protocols: [activitypub, matrix]
  email:
    implementation: "transactional mail queue, templates, verification and security events"
    external_dependency: false
  geospatial:
    implementation: "local geocoding cache, distance engine and route/location primitives"
    external_dependency: false
  ai:
    implementation: "local model gateway, moderation, transcription, embeddings and support-agent runtime"
    external_dependency: false

external_integrations:
  principle: "Only inherently external networks/providers remain external"
  required_external:
    - mpesa_safaricom
    - paypal
    - pesapal
  optional_external:
    - apns
    - web_push
    - smtp
    - external_ai_models

network:
  private_services:
    - postgres
    - redis
    - object_storage
    - queue_workers
    - notification_broker
    - video_api
    - video_worker
    - media_processor
    - ai_runtime
    - federation_worker
  public_edge_only:
    - api
    - auth
    - realtime
    - storage
    - federation
    - payment_webhooks
    - video_playback
  database_port_public: false
  tls_required_at_edge: true
