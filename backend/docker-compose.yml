name: testagram-data-centre

services:
  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      FEDERATION_DATABASE_NAME: ${FEDERATION_DATABASE_NAME:-testagram_federation}
    volumes:
      - ../migrations:/migrations:ro
      - ../scripts/migrate-data-centre.sh:/scripts/migrate-data-centre.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate-data-centre.sh"]
    restart: "no"
    networks: [platform]

  algorithm:
    image: ${TESTAGRAM_ALGORITHM_IMAGE:?Set TESTAGRAM_ALGORITHM_IMAGE to a published immutable image tag}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8092
      INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:?Set ALGORITHM_INTERNAL_TOKEN in backend/.env}
    expose: ["8092"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8092/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  federation-api:
    image: ${TESTAGRAM_FEDERATION_IMAGE:?Set TESTAGRAM_FEDERATION_IMAGE to a published immutable image tag}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: :8081
      PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://federation.testagram.site}
      INSTANCE_DOMAIN: ${FEDERATION_INSTANCE_DOMAIN:-testagram.site}
      SERVICE_ACTOR_USERNAME: ${FEDERATION_SERVICE_ACTOR_USERNAME:-testagram}
      SERVICE_ACTOR_NAME: Testagram
      SERVICE_ACTOR_SUMMARY: Testagram federated social network
      FEDERATION_DATABASE_URL: ${FEDERATION_DATABASE_URL:?Set FEDERATION_DATABASE_URL in backend/.env}
      BACKEND_INTERNAL_URL: http://api:8080
      BACKEND_INTERNAL_TOKEN: ${FEDERATION_BACKEND_INTERNAL_TOKEN:?Set FEDERATION_BACKEND_INTERNAL_TOKEN in backend/.env}
      FEDERATION_INGRESS_TOKEN: ${FEDERATION_INGRESS_TOKEN:?Set FEDERATION_INGRESS_TOKEN in backend/.env}
      FEDERATION_DELIVERY_WORKER_ENABLED: ${FEDERATION_DELIVERY_WORKER_ENABLED:-false}
      FEDERATION_OUTBOX_POLLER_ENABLED: ${FEDERATION_OUTBOX_POLLER_ENABLED:-false}
      FEDERATION_INBOX_WORKER_ENABLED: ${FEDERATION_INBOX_WORKER_ENABLED:-false}
    expose: ["8081"]
    networks:
      platform:
        aliases: [federation]
    healthcheck:
      test: ["CMD", "/federation-api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  platform:
    build:
      context: ..
      dockerfile: backend/services/platform/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:?Set PLATFORM_INTERNAL_TOKEN in backend/.env}
      PLATFORM_ADDR: :8095
    networks: [internal, platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8095/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  video:
    build:
      context: ..
      dockerfile: backend/services/video/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:?Set APPWRITE_ENDPOINT in backend/.env}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:?Set APPWRITE_PROJECT_ID in backend/.env}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET:?Set VIDEO_SIGNING_SECRET in backend/.env}
      VIDEO_MEDIA_ROOT: /media
      VIDEO_ADDR: :8790
      VIDEO_ACCOUNT_QUOTA_BYTES: ${VIDEO_ACCOUNT_QUOTA_BYTES:-21474836480}
      VIDEO_MIN_FREE_BYTES: ${VIDEO_MIN_FREE_BYTES:-2147483648}
    volumes:
      - ${TESTAGRAM_STORAGE_ROOT:-/var/lib/testagram/storage}/media:/media
    networks: [internal, platform, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8790/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  video-worker:
    build:
      context: ..
      dockerfile: backend/services/video-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      VIDEO_MEDIA_ROOT: /media
    volumes:
      - ${TESTAGRAM_STORAGE_ROOT:-/var/lib/testagram/storage}/media:/media
    networks: [internal, platform]

  notification:
    build:
      context: ..
      dockerfile: backend/services/notification/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:?Set APPWRITE_ENDPOINT in backend/.env}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:?Set APPWRITE_PROJECT_ID in backend/.env}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?Set NOTIFICATION_INTERNAL_TOKEN in backend/.env}
      NOTIFICATION_ADDR: :8090
    networks: [internal, platform, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ..
      dockerfile: backend/services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      WORKER_ADDR: :8091
    networks: [internal, platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  internal:
    internal: true
  platform:
    external: true
    name: ${TESTAGRAM_NETWORK:-testagram-platform}
  egress:
    external: true
    name: ${TESTAGRAM_EGRESS_NETWORK:-testagram-egress}
