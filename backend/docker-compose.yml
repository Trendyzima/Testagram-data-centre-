name: testagram-data-centre

services:
  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      FEDERATION_DATABASE_NAME: ${FEDERATION_DATABASE_NAME:-testagram_federation}
      FEDERATION_DATABASE_USER: ${FEDERATION_DATABASE_USER:-}
      FEDERATION_DATABASE_PASSWORD: ${FEDERATION_DATABASE_PASSWORD:-}
    volumes:
      - ../migrations:/migrations:ro
      - ../scripts/migrate-data-centre.sh:/scripts/migrate-data-centre.sh:ro
      - ../scripts/provision-federation-database.sh:/scripts/provision-federation-database.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate-data-centre.sh"]
    restart: "no"
    networks: [platform]

  algorithm:
    image: ${TESTAGRAM_ALGORITHM_IMAGE:?Set TESTAGRAM_ALGORITHM_IMAGE to a published immutable image tag}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8092
      INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:?Set ALGORITHM_INTERNAL_TOKEN in backend/.env}
    expose: ["8092"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8092/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  federation-api:
    image: ${TESTAGRAM_FEDERATION_IMAGE:?Set TESTAGRAM_FEDERATION_IMAGE to a published immutable image tag}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: :8081
      PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://testagram.site}
      INSTANCE_DOMAIN: ${FEDERATION_INSTANCE_DOMAIN:-testagram.site}
      SERVICE_ACTOR_USERNAME: ${FEDERATION_SERVICE_ACTOR_USERNAME:-testagram}
      SERVICE_ACTOR_NAME: Testagram
      SERVICE_ACTOR_SUMMARY: Testagram federated social network
      FEDERATION_DATABASE_URL: ${FEDERATION_DATABASE_URL:?Set FEDERATION_DATABASE_URL in backend/.env}
      BACKEND_INTERNAL_URL: http://api:8082
      BACKEND_INTERNAL_TOKEN: ${FEDERATION_BACKEND_INTERNAL_TOKEN:?Set FEDERATION_BACKEND_INTERNAL_TOKEN in backend/.env}
      FEDERATION_INGRESS_TOKEN: ${FEDERATION_INTERNAL_TOKEN:?Set FEDERATION_INTERNAL_TOKEN in backend/.env}
      FEDERATION_DELIVERY_WORKER_ENABLED: ${FEDERATION_DELIVERY_WORKER_ENABLED:-false}
      FEDERATION_OUTBOX_POLLER_ENABLED: ${FEDERATION_OUTBOX_POLLER_ENABLED:-false}
      FEDERATION_INBOX_ACCEPT_ENABLED: ${FEDERATION_INBOX_ACCEPT_ENABLED:-false}
      FEDERATION_INBOX_WORKER_ENABLED: ${FEDERATION_INBOX_WORKER_ENABLED:-false}
    expose: ["8081"]
    networks:
      platform:
        aliases: [federation]
      # Caddy in the Backend self-hosted stack is the only public edge.
      # Join its existing network so the apex ActivityPub routes can proxy
      # to this service without publishing the Federation container port.
      edge:
        aliases: [federation]
    healthcheck:
      test: ["CMD", "/federation-api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  platform:
    build:
      context: ..
      dockerfile: backend/services/platform/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:?Set PLATFORM_INTERNAL_TOKEN in backend/.env}
      PLATFORM_ADDR: :8095
    networks: [internal, platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8095/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  video:
    build:
      context: ..
      dockerfile: backend/services/video/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      TESTAGRAM_AUTH_JWT_SECRET: ${TESTAGRAM_AUTH_JWT_SECRET:?Set TESTAGRAM_AUTH_JWT_SECRET in backend/.env}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET:?Set VIDEO_SIGNING_SECRET in backend/.env}
      VIDEO_MEDIA_ROOT: /media
      VIDEO_ADDR: :8790
      VIDEO_ACCOUNT_QUOTA_BYTES: ${VIDEO_ACCOUNT_QUOTA_BYTES:-21474836480}
      VIDEO_MIN_FREE_BYTES: ${VIDEO_MIN_FREE_BYTES:-2147483648}
    volumes:
      - ${TESTAGRAM_STORAGE_ROOT:-/var/lib/testagram/storage}/media:/media
    networks: [internal, platform, egress, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8790/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  video-worker:
    build:
      context: ..
      dockerfile: backend/services/video-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      VIDEO_MEDIA_ROOT: /media
    volumes:
      - ${TESTAGRAM_STORAGE_ROOT:-/var/lib/testagram/storage}/media:/media
    networks: [internal, platform]

  notification:
    build:
      context: ..
      dockerfile: backend/services/notification/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      TESTAGRAM_AUTH_JWT_SECRET: ${TESTAGRAM_AUTH_JWT_SECRET:?Set TESTAGRAM_AUTH_JWT_SECRET in backend/.env}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?Set NOTIFICATION_INTERNAL_TOKEN in backend/.env}
      NOTIFICATION_ADDR: :8090
    networks: [internal, platform, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ..
      dockerfile: backend/services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      WORKER_ADDR: :8091
    networks: [internal, platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional Backend media lifecycle service. The deploy workflow enables this
  # profile only when both B2 and R2 provider configurations are complete.
  media-migrate:
    profiles: ["media"]
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      set -eu
      : "$${DATABASE_URL:?Set DATABASE_URL}"
      : "$${MEDIA_DATABASE_URL:?Set MEDIA_DATABASE_URL}"
      : "$${MEDIA_DATABASE_USER:?Set MEDIA_DATABASE_USER}"
      : "$${MEDIA_DATABASE_PASSWORD:?Set MEDIA_DATABASE_PASSWORD}"
      name="$${MEDIA_DATABASE_NAME:-testagram_media}"
      case "$$name" in ""|*[!A-Za-z0-9_]*)
        echo "MEDIA_DATABASE_NAME must contain only letters, digits and underscores" >&2
        exit 1
        ;;
      esac
      case "$$MEDIA_DATABASE_USER" in ""|*[!A-Za-z0-9_]*)
        echo "MEDIA_DATABASE_USER must contain only letters, digits and underscores" >&2
        exit 1
        ;;
      esac
      if [ "$MEDIA_DATABASE_URL" = "$DATABASE_URL" ]; then
        echo "Media lifecycle requires a separate database and restricted user from the Backend database" >&2
        exit 1
      fi
      admin_user="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_user')"
      if [ "$admin_user" = "$MEDIA_DATABASE_USER" ]; then
        echo "MEDIA_DATABASE_USER must not reuse the Backend database administrator" >&2
        exit 1
      fi
      export MEDIA_DATABASE_NAME="$name"
      psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
      \getenv media_user MEDIA_DATABASE_USER
      \getenv media_password MEDIA_DATABASE_PASSWORD
      \getenv media_db MEDIA_DATABASE_NAME
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'media_user', :'media_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'media_user') \gexec
      SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'media_user', :'media_password') \gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'media_db', :'media_user')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'media_db') \gexec
      SELECT format('ALTER DATABASE %I OWNER TO %I', :'media_db', :'media_user') \gexec
      SQL
      psql "$$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_media_lifecycle.sql
      psql "$$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/002_primary_origin_restore.sql
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
      MEDIA_DATABASE_NAME: ${MEDIA_DATABASE_NAME:-testagram_media}
      MEDIA_DATABASE_USER: ${MEDIA_DATABASE_USER:-}
      MEDIA_DATABASE_PASSWORD: ${MEDIA_DATABASE_PASSWORD:-}
    volumes:
      - ./services/media/migrations:/migrations:ro
    networks: [platform]

  media:
    profiles: ["media"]
    build:
      context: ..
      dockerfile: backend/services/media/Dockerfile
    restart: unless-stopped
    depends_on:
      media-migrate:
        condition: service_completed_successfully
    environment:
      MEDIA_ADDR: :8096
      MEDIA_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_S3_REGION: ${B2_S3_REGION:-}
      B2_S3_BUCKET: ${B2_S3_BUCKET:-}
      B2_S3_ACCESS_KEY_ID: ${B2_S3_ACCESS_KEY_ID:-}
      B2_S3_SECRET_ACCESS_KEY: ${B2_S3_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION:-auto}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      # MinIO + R2 hold metadata sidecars only; these are not a third media-byte copy.
      VPS_MINIO_ENDPOINT: ${VPS_MINIO_ENDPOINT:-http://object-storage:9000}
      VPS_MINIO_REGION: ${VPS_MINIO_REGION:-us-east-1}
      VPS_MINIO_METADATA_BUCKET: ${VPS_MINIO_METADATA_BUCKET:-}
      VPS_MINIO_METADATA_ACCESS_KEY_ID: ${VPS_MINIO_METADATA_ACCESS_KEY_ID:-}
      VPS_MINIO_METADATA_SECRET_ACCESS_KEY: ${VPS_MINIO_METADATA_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_METADATA_BUCKET: ${CLOUDFLARE_R2_METADATA_BUCKET:-}
    expose: ["8096"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8096/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:
    internal: true
  platform:
    external: true
    name: ${TESTAGRAM_NETWORK:-testagram-platform}
  edge:
    external: true
    name: ${TESTAGRAM_EDGE_NETWORK:-testagram-self-hosted_edge}
  egress:
    external: true
    name: ${TESTAGRAM_EGRESS_NETWORK:-testagram-egress}
