name: testagram-backend

services:
  edge:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    depends_on:
      video:
        condition: service_healthy
    networks: [edge, internal]

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  video:
    build:
      context: ..
      dockerfile: backend/services/video/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VIDEO_JWT_SECRET: ${VIDEO_JWT_SECRET}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET}
      VIDEO_MEDIA_ROOT: /media
      VIDEO_ADDR: :8790
    volumes: [media_data:/media]
    networks: [internal, supabase]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8790/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  video-worker:
    build:
      context: ..
      dockerfile: backend/services/video-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VIDEO_MEDIA_ROOT: /media
    volumes: [media_data:/media]
    networks: [internal, supabase]

  notification:
    build:
      context: ..
      dockerfile: backend/services/notification/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NOTIFICATION_JWT_SECRET: ${NOTIFICATION_JWT_SECRET}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}
      NOTIFICATION_ADDR: :8090
    networks: [internal, supabase]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ..
      dockerfile: backend/services/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ADDR: :8091
    networks: [internal, supabase]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  edge:
  internal:
    internal: true
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-testagram-supabase}

volumes:
  edge_data:
  edge_config:
  redis_data:
  media_data:
