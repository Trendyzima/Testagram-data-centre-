version: 3
ownership:
  mode: locally-owned
  external_providers_are_adapters: true
  firebase_fcm: disabled
  cloudinary: disabled
  cloudflare: disabled
  bunny: disabled
  upstash: disabled
  didit: disabled
  tenor: disabled
  newsify: disabled
  novu: disabled

components:
  video_platform:
    enabled: true
    implementation: testagram-owned
    api: local
    channels: local
    uploads: local_private_storage
    transcoding: local_ffmpeg
    streaming: adaptive_hls
    renditions: [240p, 360p, 720p]
    playback: signed_manifest_and_segment_urls
    metadata: supabase_postgres
    views: deduplicated
    likes: persistent
    publishing: moderation_ready_state
  notification_broker:
    enabled: true
    implementation: testagram-owned
    transport: persistent_sse_plus_local_delivery
    queue: local_durable
    persistence: supabase_postgres
  media_pipeline:
    enabled: true
    implementation: testagram-owned
    object_store: vps_authoritative_local_filesystem
    root: TESTAGRAM_STORAGE_ROOT
    namespaces: [posts, images, videos, originals, hls, posters, avatars, stories, messages, attachments, tmp]
    supabase_storage_backend: local_file
    processing: local_ffmpeg_and_image_workers
    delivery: signed_or_public_storage_urls_through_local_edge
  cache_queue:
    enabled: true
    implementation: local_redis_compatible_service
    queue: durable_local
    rate_limit: local
  edge:
    enabled: true
    implementation: testagram-owned_gateway
    tls: required
    rate_limit: local
    cache: local
    waf_policy: local
  federation:
    activitypub: true
    matrix: true
    implementation: testagram-owned_protocol_adapters
  feeds:
    rss: true
    gifs: true
    news: true
    implementation: local_fetchers_and_normalizer
  email:
    queue: local_durable
    templates: local
    delivery: local_smtp_adapter
  geospatial:
    engine: local
    distance: local
    geocoding_cache: local
  ai:
    gateway: local
    moderation: local
    transcription: local
    embeddings: local
    support_agent: local
  payments:
    ledger: local
    idempotency: local
    reconciliation: local
    providers: [mpesa, paypal, pesapal]
  identity:
    auth: supabase_self_hosted
    authorization: testagram_policy_layer
    kyc: testagram_owned_or_manual_review

security:
  secrets_external_to_git: true
  audit_events_persisted: true
  idempotency_required_for_payments: true
  signed_media_urls: true
  least_privilege_provider_credentials: true
  postgres_public: false
  internal_services_private_network: true
