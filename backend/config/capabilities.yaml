version: 3
ownership:
  mode: locally-owned
  external_providers_are_adapters: true
  firebase_fcm: disabled
  cloudinary: disabled
  cloudflare: disabled
  bunny: disabled
  upstash: disabled
  didit: disabled
  tenor: disabled
  newsify: disabled
  novu: disabled

components:
  video_platform:
    enabled: true
    implementation: testagram-owned
    api: local
    channels: local
    uploads: private_object_storage
    transcoding: local_ffmpeg
    streaming: adaptive_hls
    renditions: [240p, 360p, 720p]
    playback: signed_manifest_and_segment_urls
    metadata: postgresql
    views: deduplicated
    likes: persistent
    publishing: moderation_ready_state
  notification_broker:
    enabled: true
    implementation: testagram-owned
    transport: persistent_sse_plus_local_delivery
    queue: local_durable
    persistence: postgresql
  media_pipeline:
    enabled: true
    implementation: testagram-owned
    object_store: backblaze_b2_primary_cloudflare_r2_verified_replica
    metadata_store: dedicated_postgresql
    namespaces: [posts, images, videos, originals, hls, posters, avatars, stories, messages, attachments, tmp]
    storage_backend: s3_compatible_object_storage
    replication: asynchronous_sha256_verified_b2_to_r2
    identity_evidence: dedicated_private_buckets_on_b2_and_r2
    processing: local_ffmpeg_and_image_workers
    delivery: backend_authorized_signed_or_public_urls_through_testagram_cdn
  cache_queue:
    enabled: true
    implementation: testagram-platform-over-valkey
    cache: ttl_and_delete
    queue: redis_streams_consumer_groups
    delivery: at_least_once
    rate_limit: atomic_fixed_window
    persistence: valkey_aof
  platform_core:
    enabled: true
    implementation: testagram-owned
    feature_flags: postgres_backed_public_config
    analytics_events: postgres_backed
    audit_events: postgres_backed
    metrics: prometheus_text
    readiness: postgres_and_valkey
  edge:
    enabled: true
    implementation: caddy_plus_testagram_platform
    tls: required
    rate_limit: platform_service
    cache: platform_service_and_storage_headers
    waf_policy: local_policy_layer
  federation:
    activitypub: true
    matrix: true
    implementation: testagram-owned_protocol_adapters
  feeds:
    rss: true
    gifs: true
    news: true
    implementation: local_fetchers_and_normalizer
  email:
    queue: local_durable
    templates: local
    delivery: local_smtp_adapter
  geospatial:
    engine: local
    distance: local
    geocoding_cache: local
  ai:
    gateway: local
    moderation: local
    transcription: local
    embeddings: local
    support_agent: local
  payments:
    ledger: local
    idempotency: local
    reconciliation: local
    providers: [mpesa, paypal, pesapal]
  identity:
    auth: testagram_native
    authorization: testagram_policy_layer
    kyc: testagram_owned_or_manual_review

security:
  secrets_external_to_git: true
  audit_events_persisted: true
  idempotency_required_for_payments: true
  signed_media_urls: true
  least_privilege_provider_credentials: true
  postgres_public: false
  internal_services_private_network: true
