name: testagram-fresh
services:
  algorithm:
    profiles: ["ranking"]
    image: ${TESTAGRAM_ALGORITHM_IMAGE:-scratch}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8092
      INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
    expose: ["8092"]
    networks: [ranker]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8092/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api:
    image: ${TESTAGRAM_FRESH_BACKEND_IMAGE:?Set TESTAGRAM_FRESH_BACKEND_IMAGE to the fresh Appwrite API image pinned by digest}
    restart: unless-stopped
    environment:
      FRESH_API_ADDR: :8081
      FRESH_API_ALLOWED_ORIGINS: ${FRESH_API_ALLOWED_ORIGINS:?Set exact HTTPS Flutter/web client origins}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:?Set the fresh Appwrite endpoint}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:?Set the fresh Appwrite project ID}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:?Set the fresh Appwrite database ID}
      APPWRITE_SERVER_API_KEY: ${APPWRITE_SERVER_API_KEY:?Set a least-privilege server API key}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_REQUIRED: ${NEON_REQUIRED:-true}
      # Fresh API consumes these exact private-service variables.
      ALGORITHM_ENDPOINT: ${ALGORITHM_ENDPOINT:-http://algorithm:8092}
      ALGORITHM_INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
      FEED_RANKING_REQUIRED: "false"
      FRESH_FEDERATION_INTERNAL_TOKEN: ${FRESH_FEDERATION_INTERNAL_TOKEN:-}
      ONSPACE_AI_BASE_URL: ${ONSPACE_AI_BASE_URL:-https://ai.onspace.ai/v1}
      ONSPACE_AI_API_KEY: ${ONSPACE_AI_API_KEY:-}
      # B2 and R2 are independent full-copy stores; choose the direct-upload origin per reservation.
      # Provider keys stay in Backend, never in XClone or node-agent containers.
      FRESH_MEDIA_ENABLED: ${FRESH_MEDIA_ENABLED:-false}
      DATA_CENTRE_MEDIA_API_URL: ${DATA_CENTRE_MEDIA_API_URL:-}
      FRESH_DATA_CENTRE_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      FRESH_MEDIA_PRIMARY_PROVIDER: ${FRESH_MEDIA_PRIMARY_PROVIDER:-b2}
      TESTAGRAM_STORAGE_POOL_BYTES: ${TESTAGRAM_STORAGE_POOL_BYTES:-150000000000}
      TESTAGRAM_STORAGE_PER_USER_BYTES: ${TESTAGRAM_STORAGE_PER_USER_BYTES:-2147483648}
      ARCHIVE_S3_ENDPOINT: ${ARCHIVE_S3_ENDPOINT:-}
      ARCHIVE_S3_REGION: ${ARCHIVE_S3_REGION:-us-east-1}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_S3_ACCESS_KEY_ID: ${ARCHIVE_S3_ACCESS_KEY_ID:-}
      ARCHIVE_S3_SECRET_ACCESS_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-}
      TESTAGRAM_RETENTION_ENABLED: "false"
      TESTAGRAM_RETENTION_DRY_RUN: "true"
    expose: ["8081"]
    networks: [services, ranker]


  # Dedicated object lifecycle service. Enable only with --profile media and
  # a separate MEDIA_DATABASE_URL; never share the node control-plane database.
  media-migrate:
    profiles: ["media"]
    image: ${POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_media_lifecycle.sql
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
    volumes:
      - ../backend/services/media/migrations:/migrations:ro
    networks: [services]

  media:
    profiles: ["media"]
    build:
      context: ..
      dockerfile: backend/services/media/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_ADDR: :8096
      MEDIA_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_S3_REGION: ${B2_S3_REGION:-}
      B2_S3_BUCKET: ${B2_S3_BUCKET:-}
      B2_S3_ACCESS_KEY_ID: ${B2_S3_ACCESS_KEY_ID:-}
      B2_S3_SECRET_ACCESS_KEY: ${B2_S3_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION:-auto}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
    expose: ["8096"]
    networks: [services]
    depends_on:
      media-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8096/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  federation-db:
    profiles: ["local"]
    image: ${FEDERATION_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: testagram_federation
      POSTGRES_PASSWORD: ${FEDERATION_DB_PASSWORD:-local-development-only}
      POSTGRES_DB: testagram_federation
    volumes:
      - federation_data:/var/lib/postgresql/data
    expose: ["5432"]
    networks: [federation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testagram_federation -d testagram_federation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  federation-api:
    profiles: ["federation"]
    image: ${TESTAGRAM_FEDERATION_IMAGE:-scratch}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8081
      APP_ENV: production
      PUBLIC_BASE_URL: https://federation.testagram.site
      INSTANCE_DOMAIN: testagram.site
      SERVICE_ACTOR_USERNAME: testagram
      SERVICE_ACTOR_NAME: Testagram
      SERVICE_ACTOR_SUMMARY: Testagram federated social network
      FEDERATION_DATABASE_URL: ${FEDERATION_DATABASE_URL:-}
      BACKEND_INTERNAL_URL: http://api:8081
      BACKEND_INTERNAL_TOKEN: ${FRESH_FEDERATION_INTERNAL_TOKEN:-}
      FEDERATION_INGRESS_TOKEN: ${FEDERATION_INGRESS_TOKEN:-}
      FEDERATION_DELIVERY_WORKER_ENABLED: ${FEDERATION_DELIVERY_WORKER_ENABLED:-false}
      FEDERATION_OUTBOX_POLLER_ENABLED: ${FEDERATION_OUTBOX_POLLER_ENABLED:-false}
      FEDERATION_INBOX_WORKER_ENABLED: ${FEDERATION_INBOX_WORKER_ENABLED:-false}
    expose: ["8081"]
    networks: [services, federation]
    depends_on:
      # Federation has its own authenticated Backend readiness probe. Do not
      # gate it on the public API's full readiness, which also requires Algorithm.
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/federation-api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    profiles: ["nodes"]
    image: ${POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      # Only Data Centre-owned infrastructure state belongs in this database.
      # Never apply the product/video, notification, retired object-storage, or
      # platform migrations from this deployment path.
      psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_vps.sql
      psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/006_hosting_control_plane.sql
    environment:
      DATABASE_URL: ${DATA_CENTRE_DATABASE_URL:-}
    volumes:
      - ../migrations:/migrations:ro
    networks: [services]

  control-plane:
    profiles: ["nodes"]
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATA_CENTRE_DATABASE_URL:?Set a dedicated TLS PostgreSQL URL for Data Centre infrastructure state}
      VPS_INTERNAL_TOKEN: ${VPS_INTERNAL_TOKEN:-}
      VPS_NODE_BOOTSTRAP_TOKEN: ${VPS_NODE_BOOTSTRAP_TOKEN:-}
      TESTAGRAM_BASE_DOMAIN: ${TESTAGRAM_BASE_DOMAIN:-}
      TESTAGRAM_DOMAIN_TARGETS: ${TESTAGRAM_DOMAIN_TARGETS:-}
      TESTAGRAM_PUBLIC_DNS_TARGET: ${TESTAGRAM_PUBLIC_DNS_TARGET:-}
      TESTAGRAM_PUBLIC_ORIGIN_IP: ${TESTAGRAM_PUBLIC_ORIGIN_IP:-}
      VPS_CONTROL_PLANE_ADDR: :8787
    ports:
      - "127.0.0.1:8787:8787"
    networks: [services]
    depends_on:
      migrate:
        condition: service_completed_successfully

  edge:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable Caddy image digest}
    restart: unless-stopped
    environment:
      TLS_ADMIN_EMAIL: ${TLS_ADMIN_EMAIL:?Set TLS_ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./fresh/Caddyfile:/etc/caddy/Caddyfile:ro
      - fresh_edge_data:/data
      - fresh_edge_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, services]

networks:
  edge: {}
  services: {}
  ranker:
    internal: true
  federation:
    internal: true

volumes:
  fresh_edge_data: {}
  fresh_edge_config: {}
  federation_data: {}
