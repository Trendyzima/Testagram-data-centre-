name: testagram-fresh
services:
  algorithm:
    profiles: ["ranking"]
    image: ${TESTAGRAM_ALGORITHM_IMAGE:-scratch}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8092
      INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
    expose: ["8092"]
    networks: [ranker]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8092/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api:
    image: ${TESTAGRAM_BACKEND_IMAGE:?Set TESTAGRAM_BACKEND_IMAGE to the canonical Backend image pinned by digest}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: :8080
      INTERNAL_LISTEN_ADDR: :8082
      DATABASE_URL: ${DATABASE_URL:?Set the canonical Testagram product PostgreSQL URL}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      TESTAGRAM_AUTH_JWT_SECRET: ${TESTAGRAM_AUTH_JWT_SECRET:?Set the stable native-auth JWT signing secret}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-https://testagram.site}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set exact HTTPS Flutter/web client origins}
      # Optional private ranker. Login and the public API do not depend on it.
      ALGORITHM_URL: ${ALGORITHM_URL:-}
      ALGORITHM_INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
      # Federation uses two distinct directions/tokens: Backend -> Federation
      # ingress, and Federation -> Backend private API.
      FEDERATION_INTERNAL_URL: ${FEDERATION_INTERNAL_URL:-}
      FEDERATION_INTERNAL_TOKEN: ${FEDERATION_INTERNAL_TOKEN:-}
      FEDERATION_BACKEND_INTERNAL_TOKEN: ${FEDERATION_BACKEND_INTERNAL_TOKEN:-}
      FEDERATION_PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://testagram.site}
      # Backend-to-Data-Centre media bridge. Provider credentials remain in media only.
      FRESH_MEDIA_ENABLED: ${FRESH_MEDIA_ENABLED:-false}
      DATA_CENTRE_MEDIA_API_URL: ${DATA_CENTRE_MEDIA_API_URL:-}
      FRESH_DATA_CENTRE_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      CDN_MEDIA_ASSERTION_SECRET: ${CDN_MEDIA_ASSERTION_SECRET:-}
      CDN_MEDIA_BASE_URL: ${CDN_MEDIA_BASE_URL:-}
      CDN_ORIGIN_AUTH_TOKEN: ${CDN_ORIGIN_AUTH_TOKEN:-}
      CDN_PURGE_URL: ${CDN_PURGE_URL:-}
      CDN_PURGE_TOKEN: ${CDN_PURGE_TOKEN:-}
      # Native-auth transactional email; optional until mail is provisioned.
      CLOUDFLARE_EMAIL_ACCOUNT_ID: ${CLOUDFLARE_EMAIL_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      AUTH_FROM_EMAIL: ${AUTH_FROM_EMAIL:-}
      TESTAGRAM_MAIL_ENCRYPTION_KEY: ${TESTAGRAM_MAIL_ENCRYPTION_KEY:-}
      # Keep API-side direct object storage and replication disabled. The Data
      # Centre media service owns B2/R2 credentials and object lifecycle.
      VIRTUAL_STORAGE_ENABLED: "false"
      MEDIA_REPLICATION_ENABLED: "false"
    expose: ["8080", "8082"]
    networks:
      services: {}
      ranker: {}
      platform:
        aliases: [testagram-backend-api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s


  # Dedicated object lifecycle service. Enable only with --profile media and
  # a separate MEDIA_DATABASE_URL; never share the node control-plane database.
  media-migrate:
    profiles: ["media"]
    image: ${POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_media_lifecycle.sql
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
    volumes:
      - ../backend/services/media/migrations:/migrations:ro
    networks: [services]

  media:
    profiles: ["media"]
    build:
      context: ..
      dockerfile: backend/services/media/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_ADDR: :8096
      MEDIA_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL:-}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_S3_REGION: ${B2_S3_REGION:-}
      B2_S3_BUCKET: ${B2_S3_BUCKET:-}
      B2_S3_ACCESS_KEY_ID: ${B2_S3_ACCESS_KEY_ID:-}
      B2_S3_SECRET_ACCESS_KEY: ${B2_S3_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION:-auto}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
    expose: ["8096"]
    networks: [services, platform]
    depends_on:
      media-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8096/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  federation-db:
    profiles: ["local"]
    image: ${FEDERATION_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: testagram_federation
      POSTGRES_PASSWORD: ${FEDERATION_DB_PASSWORD:-local-development-only}
      POSTGRES_DB: testagram_federation
    volumes:
      - federation_data:/var/lib/postgresql/data
    expose: ["5432"]
    networks: [federation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testagram_federation -d testagram_federation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  federation-api:
    profiles: ["federation"]
    image: ${TESTAGRAM_FEDERATION_IMAGE:-scratch}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8081
      APP_ENV: production
      PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://testagram.site}
      INSTANCE_DOMAIN: testagram.site
      SERVICE_ACTOR_USERNAME: testagram
      SERVICE_ACTOR_NAME: Testagram
      SERVICE_ACTOR_SUMMARY: Testagram federated social network
      FEDERATION_DATABASE_URL: ${FEDERATION_DATABASE_URL:-}
      BACKEND_INTERNAL_URL: http://testagram-backend-api:8082
      BACKEND_INTERNAL_TOKEN: ${FEDERATION_BACKEND_INTERNAL_TOKEN:-}
      FEDERATION_INGRESS_TOKEN: ${FEDERATION_INGRESS_TOKEN:-}
      FEDERATION_DELIVERY_WORKER_ENABLED: ${FEDERATION_DELIVERY_WORKER_ENABLED:-false}
      FEDERATION_OUTBOX_POLLER_ENABLED: ${FEDERATION_OUTBOX_POLLER_ENABLED:-false}
      FEDERATION_INBOX_WORKER_ENABLED: ${FEDERATION_INBOX_WORKER_ENABLED:-false}
    expose: ["8081"]
    networks: [services, federation, platform]
    # Backend is reached over the shared private platform network; do not
    # depend on the legacy Data Centre "api" container or start it implicitly.
    healthcheck:
      test: ["CMD", "/federation-api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    profiles: ["nodes"]
    image: ${POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      # Only Data Centre-owned infrastructure state belongs in this database.
      # Never apply the product/video, notification, retired object-storage, or
      # platform migrations from this deployment path.
      psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_vps.sql
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/006_hosting_control_plane.sql
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/vps/008_user_activity_watchdog.sql
    environment:
      DATABASE_URL: ${DATA_CENTRE_DATABASE_URL:-}
    volumes:
      - ../migrations:/migrations:ro
    networks: [services]

  control-plane:
    profiles: ["nodes"]
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATA_CENTRE_DATABASE_URL:?Set a dedicated TLS PostgreSQL URL for Data Centre infrastructure state}
      VPS_INTERNAL_TOKEN: ${VPS_INTERNAL_TOKEN:-}
      VPS_NODE_BOOTSTRAP_TOKEN: ${VPS_NODE_BOOTSTRAP_TOKEN:-}
      VPS_WATCHDOG_INTERNAL_TOKEN: ${VPS_WATCHDOG_INTERNAL_TOKEN:-}
      TESTAGRAM_BASE_DOMAIN: ${TESTAGRAM_BASE_DOMAIN:-}
      TESTAGRAM_DOMAIN_TARGETS: ${TESTAGRAM_DOMAIN_TARGETS:-}
      TESTAGRAM_PUBLIC_DNS_TARGET: ${TESTAGRAM_PUBLIC_DNS_TARGET:-}
      TESTAGRAM_PUBLIC_ORIGIN_IP: ${TESTAGRAM_PUBLIC_ORIGIN_IP:-}
      VPS_CONTROL_PLANE_ADDR: :8787
    ports:
      - "127.0.0.1:8787:8787"
    networks: [services, platform]
    depends_on:
      migrate:
        condition: service_completed_successfully

  edge:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable Caddy image digest}
    restart: unless-stopped
    environment:
      TLS_ADMIN_EMAIL: ${TLS_ADMIN_EMAIL:?Set TLS_ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./fresh/Caddyfile:/etc/caddy/Caddyfile:ro
      - fresh_edge_data:/data
      - fresh_edge_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, services]

networks:
  edge: {}
  services: {}
  # Join the Backend's private platform network so Backend can reach media:8096.
  # Deploy the Backend stack first; it creates testagram-platform.
  platform:
    name: testagram-platform
    external: true
  ranker:
    name: testagram-ranker
    external: true
  federation:
    internal: true

volumes:
  fresh_edge_data: {}
  fresh_edge_config: {}
  federation_data: {}
