name: Publish digest-pinned Data Centre media runtime images

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "internal/videomedia/**"
      - "backend/services/media/**"
      - "backend/services/video/**"
      - "backend/services/video-worker/**"
      - ".github/workflows/publish-runtime-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: testagram-data-centre-runtime-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }} runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: media
            image: ghcr.io/trendyzima/testagram-media
            dockerfile: backend/services/media/Dockerfile
          - name: video
            image: ghcr.io/trendyzima/testagram-video
            dockerfile: backend/services/video/Dockerfile
          - name: video-worker
            image: ghcr.io/trendyzima/testagram-video-worker
            dockerfile: backend/services/video-worker/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tags and provenance labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Testagram Data Centre ${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish immutable runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record immutable image digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "### ${{ matrix.name }} runtime image"
            echo "- Source revision: $SOURCE_SHA"
            echo "- Immutable image: $IMAGE@$DIGEST"
            echo "- Mutable convenience tag: $IMAGE:main"
          } >> "$GITHUB_STEP_SUMMARY"
