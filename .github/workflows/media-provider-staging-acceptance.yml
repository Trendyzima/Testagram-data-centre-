name: Data Centre media provider staging acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_staging_provider_writes:
        description: Confirm that the configured B2/R2 buckets and service tokens are dedicated non-production staging resources and may be written, repaired and deleted.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-data-centre-media-staging
  cancel-in-progress: false

jobs:
  media-provider-lifecycle:
    if: inputs.confirm_staging_provider_writes == true
    name: General-media B2/R2 replication and B2-only identity-evidence lifecycle
    runs-on: ubuntu-latest
    environment: media-staging
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testagram_media
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-media-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testagram_media"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TESTAGRAM_LIVE_MEDIA_SMOKE: "true"
      MEDIA_DATABASE_URL: postgresql://postgres:ci-only-media-db-password@127.0.0.1:5432/testagram_media?sslmode=disable
      MEDIA_INTERNAL_TOKEN: ${{ secrets.MEDIA_STAGING_INTERNAL_TOKEN }}
      IDENTITY_EVIDENCE_INTERNAL_TOKEN: ${{ secrets.MEDIA_STAGING_IDENTITY_EVIDENCE_INTERNAL_TOKEN }}
      MEDIA_SMOKE_B2_ENDPOINT: ${{ vars.MEDIA_STAGING_B2_ENDPOINT }}
      MEDIA_SMOKE_B2_REGION: ${{ vars.MEDIA_STAGING_B2_REGION }}
      MEDIA_SMOKE_B2_BUCKET: ${{ vars.MEDIA_STAGING_B2_PRIVATE_BUCKET }}
      MEDIA_SMOKE_B2_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_B2_ACCESS_KEY_ID }}
      MEDIA_SMOKE_B2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_B2_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_B2_IDENTITY_BUCKET: ${{ vars.MEDIA_STAGING_B2_IDENTITY_BUCKET }}
      MEDIA_SMOKE_B2_IDENTITY_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_B2_IDENTITY_ACCESS_KEY_ID }}
      MEDIA_SMOKE_B2_IDENTITY_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_B2_IDENTITY_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_R2_ENDPOINT: ${{ vars.MEDIA_STAGING_R2_ENDPOINT }}
      MEDIA_SMOKE_R2_REGION: ${{ vars.MEDIA_STAGING_R2_REGION }}
      MEDIA_SMOKE_R2_BUCKET: ${{ vars.MEDIA_STAGING_R2_PRIVATE_BUCKET }}
      MEDIA_SMOKE_R2_PUBLIC_BUCKET: ${{ vars.MEDIA_STAGING_R2_PUBLIC_BUCKET }}
      MEDIA_SMOKE_R2_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_R2_ACCESS_KEY_ID }}
      MEDIA_SMOKE_R2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_R2_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_R2_METADATA_BUCKET: ${{ vars.MEDIA_STAGING_R2_METADATA_BUCKET }}
      MEDIA_SMOKE_MINIO_METADATA_ENDPOINT: http://127.0.0.1:9000
      MEDIA_SMOKE_MINIO_METADATA_REGION: us-east-1
      MEDIA_SMOKE_MINIO_METADATA_BUCKET: testagram-ci-media-metadata
      MEDIA_SMOKE_MINIO_METADATA_ACCESS_KEY_ID: ci-testagram-metadata
      MEDIA_SMOKE_MINIO_METADATA_SECRET_ACCESS_KEY: ci-only-metadata-secret-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Validate isolated staging resources before any provider write
        shell: bash
        run: |
          set -euo pipefail
          for name in MEDIA_INTERNAL_TOKEN IDENTITY_EVIDENCE_INTERNAL_TOKEN MEDIA_SMOKE_B2_ENDPOINT MEDIA_SMOKE_B2_REGION MEDIA_SMOKE_B2_BUCKET MEDIA_SMOKE_B2_ACCESS_KEY_ID MEDIA_SMOKE_B2_SECRET_ACCESS_KEY MEDIA_SMOKE_B2_IDENTITY_BUCKET MEDIA_SMOKE_B2_IDENTITY_ACCESS_KEY_ID MEDIA_SMOKE_B2_IDENTITY_SECRET_ACCESS_KEY MEDIA_SMOKE_R2_ENDPOINT MEDIA_SMOKE_R2_REGION MEDIA_SMOKE_R2_BUCKET MEDIA_SMOKE_R2_ACCESS_KEY_ID MEDIA_SMOKE_R2_SECRET_ACCESS_KEY MEDIA_SMOKE_R2_METADATA_BUCKET MEDIA_SMOKE_R2_PUBLIC_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing media-staging environment setting: $name"; exit 1; }
          done
          [[ "${#MEDIA_INTERNAL_TOKEN}" -ge 32 && "${#IDENTITY_EVIDENCE_INTERNAL_TOKEN}" -ge 32 ]] || { echo "::error::Dedicated media service tokens must be at least 32 characters"; exit 1; }
          [[ "$MEDIA_INTERNAL_TOKEN" != "$IDENTITY_EVIDENCE_INTERNAL_TOKEN" ]] || { echo "::error::Media and identity-evidence service tokens must be distinct"; exit 1; }
          [[ "$MEDIA_SMOKE_B2_ACCESS_KEY_ID" != "$MEDIA_SMOKE_B2_IDENTITY_ACCESS_KEY_ID" ]] || { echo "::error::Ordinary-media and identity-evidence B2 access key IDs must be distinct"; exit 1; }
          [[ "$MEDIA_SMOKE_B2_SECRET_ACCESS_KEY" != "$MEDIA_SMOKE_B2_IDENTITY_SECRET_ACCESS_KEY" ]] || { echo "::error::Ordinary-media and identity-evidence B2 secrets must be distinct"; exit 1; }
          [[ "$MEDIA_SMOKE_B2_ENDPOINT" == https://* && "$MEDIA_SMOKE_R2_ENDPOINT" == https://* ]] || { echo "::error::B2 and R2 endpoints must use HTTPS"; exit 1; }

          b2_host="$(printf '%s' "$MEDIA_SMOKE_B2_ENDPOINT" | sed -E 's#^https://([^/:]+).*$#\1#' | tr '[:upper:]' '[:lower:]' | sed 's/\.$//')"
          r2_host="$(printf '%s' "$MEDIA_SMOKE_R2_ENDPOINT" | sed -E 's#^https://([^/:]+).*$#\1#' | tr '[:upper:]' '[:lower:]' | sed 's/\.$//')"
          [[ -n "$b2_host" && -n "$r2_host" && "$b2_host" != "$r2_host" ]] || { echo "::error::B2 and R2 staging endpoints must resolve to distinct hostnames"; exit 1; }
          for bucket in "$MEDIA_SMOKE_B2_BUCKET" "$MEDIA_SMOKE_B2_IDENTITY_BUCKET" "$MEDIA_SMOKE_R2_BUCKET" "$MEDIA_SMOKE_R2_PUBLIC_BUCKET" "$MEDIA_SMOKE_R2_METADATA_BUCKET"; do
            [[ "$bucket" =~ (^|[-_])(ci|staging|smoke)([-_]|$) ]] || { echo "::error::Every provider bucket must explicitly identify isolated staging/smoke data"; exit 1; }
            [[ ! "$bucket" =~ (^|[-_])(prod|production)([-_]|$) ]] || { echo "::error::Production bucket rejected"; exit 1; }
          done
          [[ "$MEDIA_SMOKE_B2_BUCKET" != "$MEDIA_SMOKE_B2_IDENTITY_BUCKET" ]] || { echo "::error::Identity evidence buckets must be separate from ordinary media buckets"; exit 1; }
          [[ "$MEDIA_SMOKE_B2_IDENTITY_BUCKET" =~ (^|[-_])(ci|staging|smoke)([-_]|$) ]] || { echo "::error::Identity evidence bucket must be a dedicated staging bucket"; exit 1; }
          if grep -q "CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET" backend/docker-compose.yml; then echo "::error::Identity evidence must not have an R2 bucket configuration."; exit 1; fi
          grep -q "004_identity_evidence_b2_only.sql" .github/workflows/media-provider-staging-acceptance.yml || { echo "::error::B2-only identity migration is missing from staging."; exit 1; }
          [[ "$MEDIA_SMOKE_R2_BUCKET" != "$MEDIA_SMOKE_R2_PUBLIC_BUCKET" ]] || { echo "::error::R2 private and public general-media buckets must be distinct"; exit 1; }
          [[ "$MEDIA_SMOKE_R2_METADATA_BUCKET" != "$MEDIA_SMOKE_R2_BUCKET" && "$MEDIA_SMOKE_R2_METADATA_BUCKET" != "$MEDIA_SMOKE_R2_PUBLIC_BUCKET" ]] || { echo "::error::R2 metadata sidecar bucket must be separate from general media"; exit 1; }
          echo "Validated dedicated staging-only B2/R2 buckets and distinct service credentials. Values are not printed."
      - name: Install AWS CLI for isolated MinIO metadata bucket
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends awscli
      - name: Start isolated MinIO metadata store
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name testagram-minio-media-metadata-smoke -p 9000:9000 -e MINIO_ROOT_USER="$MEDIA_SMOKE_MINIO_METADATA_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$MEDIA_SMOKE_MINIO_METADATA_SECRET_ACCESS_KEY" ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data --address ":9000" --console-address ":9001"
          for attempt in $(seq 1 40); do
            if curl -fsS "$MEDIA_SMOKE_MINIO_METADATA_ENDPOINT/minio/health/live" >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then echo "::error::Isolated MinIO metadata store did not become healthy"; exit 1; fi
            sleep 2
          done
          export AWS_ACCESS_KEY_ID="$MEDIA_SMOKE_MINIO_METADATA_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$MEDIA_SMOKE_MINIO_METADATA_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$MEDIA_SMOKE_MINIO_METADATA_REGION"
          aws --endpoint-url "$MEDIA_SMOKE_MINIO_METADATA_ENDPOINT" s3api create-bucket --bucket "$MEDIA_SMOKE_MINIO_METADATA_BUCKET" >/dev/null
      - name: Apply isolated Data Centre media database migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in backend/services/media/migrations/001_media_lifecycle.sql backend/services/media/migrations/002_primary_origin_restore.sql backend/services/media/migrations/003_identity_evidence_namespace.sql backend/services/media/migrations/004_identity_evidence_b2_only.sql; do
            psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/services/media/migrations/test_identity_evidence_b2_only.sql
      - name: Exercise real provider round-trip, B2/R2 restore, repair and deletion
        run: go test -count=1 -run '^(TestLiveProviderRoundTrip|TestLiveMediaReplicationRestoreDelete|TestLiveIdentityEvidenceLifecycle|TestLiveIdentityEvidenceProviderCredentialIsolation)
      - name: Stop isolated MinIO metadata store
        if: always()
        run: docker rm -f testagram-minio-media-metadata-smoke >/dev/null 2>&1 || true
      - name: Record staging acceptance scope
        if: success()
        run: |
          {
            echo "### Data Centre media provider staging acceptance"
            echo "- Source revision: $GITHUB_SHA"
            echo "- B2 and R2 upload, HEAD, read-back and SHA-256 verification exercised."
            echo "- Durable B2-to-R2 replication and R2-to-B2 primary restoration exercised."
            echo "- Identity evidence was stored, verified, downloaded and deleted exclusively in the dedicated Backblaze B2 identity bucket."
            echo "- Separate identity-evidence credentials, namespace authorization and cross-application denial exercised."
            echo "- Temporary objects and database rows are cleaned by the test harness."
            echo "- No production buckets, credentials, DNS, deployments or VPS services were used."
            echo "- This is provider/service lifecycle evidence, not proof of same-deployment Backend-to-CDN-to-Flutter acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
 -v ./backend/services/media
      - name: Stop isolated MinIO metadata store
        if: always()
        run: docker rm -f testagram-minio-media-metadata-smoke >/dev/null 2>&1 || true
      - name: Record staging acceptance scope
        if: success()
        run: |
          {
            echo "### Data Centre media provider staging acceptance"
            echo "- Source revision: $GITHUB_SHA"
            echo "- B2 and R2 upload, HEAD, read-back and SHA-256 verification exercised."
            echo "- Durable B2-to-R2 replication and R2-to-B2 primary restoration exercised."
            echo "- Identity evidence was stored, verified, downloaded and deleted exclusively in the dedicated Backblaze B2 identity bucket."
            echo "- Separate identity-evidence credentials, namespace authorization and cross-application denial exercised."
            echo "- Temporary objects and database rows are cleaned by the test harness."
            echo "- No production buckets, credentials, DNS, deployments or VPS services were used."
            echo "- This is provider/service lifecycle evidence, not proof of same-deployment Backend-to-CDN-to-Flutter acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
