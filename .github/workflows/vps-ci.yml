name: testagram-vps-ci
on:
  push:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
  pull_request:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: gofmt -w control-plane node-agent internal backend/services/video backend/services/video-worker
      - run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./control-plane ./node-agent ./backend/services/video ./backend/services/video-worker
      - name: Validate VPS/Supabase boundary
        run: |
          set -euo pipefail
          bash -n supabase/bootstrap.sh
          bash -n supabase/prepare.sh
          bash -n supabase/status.sh
          bash -n supabase/healthcheck.sh
          test -f backend/docker-compose.yml
          test -f backend/runtime/Caddyfile
          test -f backend/services/notification/Dockerfile
          test -f backend/services/worker/Dockerfile
          test -f backend/services/video/Dockerfile
          test -f backend/services/video-worker/Dockerfile
          test -f backend/services/video/main.go
          test -f backend/services/video-worker/main.go
          test -f migrations/002_video_platform.sql
          ! grep -RniE 'youtube|google_youtube' backend supabase/UPSTREAMS.yaml
      - name: Validate Compose syntax
        run: |
          docker compose -f backend/docker-compose.yml config
      - name: Validate Caddy syntax
        run: |
          docker run --rm -v "$PWD/backend/runtime/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Build backend containers
        run: |
          docker compose -f backend/docker-compose.yml build video video-worker notification worker
