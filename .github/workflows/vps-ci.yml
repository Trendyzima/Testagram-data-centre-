      - name: Backend runtime smoke test
        run: |
          set -euo pipefail
          docker network create testagram-platform 2>/dev/null || true
          docker network create --internal testagram-video-private 2>/dev/null || true
          docker network create testagram-egress 2>/dev/null || true
          docker network create testagram-self-hosted_edge 2>/dev/null || true
          trap 'docker rm -f testagram-api testagram-postgres >/dev/null 2>&1 || true; docker compose -f backend/docker-compose.yml down -v >/dev/null 2>&1 || true; docker network rm testagram-self-hosted_edge testagram-egress testagram-platform testagram-video-private >/dev/null 2>&1 || true' EXIT
          docker run -d --name testagram-postgres --network testagram-platform --network-alias federation-db -e POSTGRES_PASSWORD=testagram postgres:17-alpine
          # The video service is deliberately absent from the shared platform
          # network. Give it database reachability only through video-private.
          docker network connect testagram-video-private testagram-postgres
          trap 'status=$?; echo "Backend runtime smoke failed at: $BASH_COMMAND"; docker compose -f backend/docker-compose.yml logs --no-color platform algorithm federation-api video notification worker 2>&1 || true; docker logs testagram-api 2>&1 || true; exit "$status"' ERR
          for i in $(seq 1 30); do
            docker exec testagram-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-postgres pg_isready -U postgres -d postgres
          docker exec testagram-postgres createdb -U postgres testagram
          # Backend migrations grant privileges to the application role. Provision it in the
          # clean CI database before applying the canonical Backend migrations.
          docker exec testagram-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DO \$role\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'testagram_app') THEN CREATE ROLE testagram_app NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$role\$;"
          for migration in backend-source/migrations/*.sql; do
            # Thread interaction tables depend on the canonical threads table. Apply its
            # prerequisite immediately before the interaction migration, not by filename glob order.
            if [ "$migration" = "backend-source/migrations/20261109_thread_interactions.sql" ]; then
              docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/20261109_threads_browsing_history.sql
            fi
            if [ "$migration" = "backend-source/migrations/20261109_threads_browsing_history.sql" ]; then
              continue
            fi
            # The identity evidence migration references verification_sessions.
            # Apply its canonical prerequisite at this point and skip its earlier
            # lexical position so the dependency is explicit and visible in CI.
            if [ "$migration" = "backend-source/migrations/20261114_native_identity_evidence.sql" ]; then
              test -f backend-source/migrations/20261113_native_identity_verification.sql
              docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/20261113_native_identity_verification.sql
            fi
            if [ "$migration" = "backend-source/migrations/20261113_native_identity_verification.sql" ]; then
              continue
            fi
            # The historical attribution archive comments on and preserves the
            # new native decider UUID. Its same-day decider migration sorts
            # after the archive by filename, so apply the prerequisite first.
            if [ "$migration" = "backend-source/migrations/20261120_native_identity_historical_attribution_archive.sql" ]; then
              echo "Applying canonical Backend migration prerequisite: backend-source/migrations/20261120_native_verification_decider.sql"
              docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/20261120_native_verification_decider.sql
            fi
            if [ "$migration" = "backend-source/migrations/20261120_native_verification_decider.sql" ]; then
              continue
            fi
            # The immutable sensitive-action migration depends on the native
            # auth schema, admin approval ledger and WebAuthn credentials,
            # which sort after its historical numeric filename. Defer it until
            # every canonical Backend migration has been applied.
            if [ "$migration" = "backend-source/migrations/061_native_sensitive_action_integrity.sql" ]; then
              continue
            fi
            # Knowledge migrations use testagram_local.accounts and topics,
            # which are provisioned by later timestamped native-product
            # migrations. Defer both until the canonical account schema exists.
            if [ "$migration" = "backend-source/migrations/062_testagram_knowledge_engine.sql" ]; then
              continue
            fi
            if [ "$migration" = "backend-source/migrations/064_knowledge_topic_seed_catalog.sql" ]; then
              continue
            fi
            echo "Applying canonical Backend migration: $migration"
            docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < "$migration"
          done
          # Apply the append-only sensitive-action hardening only after all
          # native identity, staff-console and WebAuthn prerequisites exist.
          echo "Applying deferred canonical Backend migration: backend-source/migrations/061_native_sensitive_action_integrity.sql"
          docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/061_native_sensitive_action_integrity.sql
          echo "Applying deferred canonical Backend migration: backend-source/migrations/062_testagram_knowledge_engine.sql"
          docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/062_testagram_knowledge_engine.sql
          echo "Applying deferred canonical Backend migration: backend-source/migrations/064_knowledge_topic_seed_catalog.sql"
          docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < backend-source/migrations/064_knowledge_topic_seed_catalog.sql
          docker exec testagram-postgres psql -U postgres -d testagram -Atqc "SELECT to_regclass('testagram_local.federation_outbox') IS NOT NULL AND to_regclass('testagram_local.communication_outbox') IS NOT NULL" | grep -qx t
          docker build -f backend-source/Dockerfile -t testagram-backend-ci backend-source
          export DATABASE_URL=postgresql://postgres:testagram@testagram-postgres:5432/testagram
          export TESTAGRAM_AUTH_JWT_SECRET=ci-testagram-native-auth-secret-at-least-32-bytes
          export VIDEO_SIGNING_SECRET=ci-test-signing-secret-at-least-32-bytes
          export NOTIFICATION_INTERNAL_TOKEN=ci-test-internal-token
          export PLATFORM_INTERNAL_TOKEN=ci-platform-internal-token-2026-strong
          export TESTAGRAM_NETWORK=testagram-platform
          export TESTAGRAM_VIDEO_NETWORK=testagram-video-private
          docker run -d --name testagram-api --network testagram-platform --network-alias api \
            -e LISTEN_ADDR=:8080 -e INTERNAL_LISTEN_ADDR=:8082 \
            -e DATABASE_URL=postgresql://postgres:testagram@testagram-postgres:5432/testagram?sslmode=disable \
            -e TESTAGRAM_AUTH_JWT_SECRET=ci-testagram-native-auth-secret-at-least-32-bytes \
            -e DATA_CENTRE_VIDEO_API_URL=http://video:8790 \
            -e ALGORITHM_URL=http://algorithm:8092 -e ALGORITHM_INTERNAL_TOKEN=ci-algorithm-internal-token-long-enough \
            -e FEDERATION_INTERNAL_URL=http://federation:8081 -e FEDERATION_INTERNAL_TOKEN=ci-federation-ingress-token-long-enough \
            -e FEDERATION_BACKEND_INTERNAL_TOKEN=ci-federation-backend-read-token-long-enough \
            testagram-backend-ci
          docker network connect testagram-video-private testagram-api
          for i in $(seq 1 30); do
            docker exec testagram-api wget -q -O - http://127.0.0.1:8082/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-api wget -q -O - http://127.0.0.1:8082/readyz
          docker exec testagram-api wget -q -O - http://127.0.0.1:8080/health | grep -q '"ok":true'
          catalog_response="$(docker exec testagram-api sh -c 'wget -S -O /dev/null http://127.0.0.1:8080/internal/tv/catalog 2>&1 || true')"
          grep -q '401 Unauthorized' <<<"$catalog_response"
          health_response="$(docker exec testagram-api sh -c 'wget -S -O /dev/null --post-data="{}" http://127.0.0.1:8080/internal/tv/health 2>&1 || true')"
          grep -q '401 Unauthorized' <<<"$health_response"
          if docker exec testagram-api wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1; then echo 'public Backend listener exposed readiness'; exit 1; fi
          docker compose -f backend/docker-compose.yml pull algorithm federation-api
          # Docker bind mounts hide image-layer ownership. Mirror the VPS
          # media-volume provisioning so the non-root worker is tested with
          # the same writable UID/GID (65532) it receives in production.
          export TESTAGRAM_STORAGE_ROOT="${RUNNER_TEMP:-/tmp}/testagram-video-worker-storage"
          mkdir -p "$TESTAGRAM_STORAGE_ROOT/media"
          sudo chown -R 65532:65532 "$TESTAGRAM_STORAGE_ROOT/media"
          sudo chmod 0770 "$TESTAGRAM_STORAGE_ROOT/media"
          docker compose -f backend/docker-compose.yml up -d platform video video-worker notification worker algorithm federation-api
          video_worker_id="$(docker compose -f backend/docker-compose.yml ps -q video-worker)"
          test -n "$video_worker_id" || { echo "::error::Video worker container was not created"; exit 1; }
          video_worker_health=""
          for i in $(seq 1 30); do
            video_worker_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$video_worker_id")"
            [[ "$video_worker_health" == healthy ]] && break
            sleep 2
          done
          [[ "$video_worker_health" == healthy ]] || { docker inspect --format '{{json .State.Health}}' "$video_worker_id" || true; docker compose -f backend/docker-compose.yml logs --no-color video-worker; echo "::error::Video worker did not pass its PostgreSQL and writable-media readiness check"; exit 1; }
          # Exercise the actual poster + HLS transcode queue, not only readiness.
          smoke_video_id="$(cat /proc/sys/kernel/random/uuid)"
          smoke_channel_id="$(cat /proc/sys/kernel/random/uuid)"
          smoke_owner_id="00000000-0000-4000-8000-000000000001"
          smoke_source="/media/videos/originals/$smoke_video_id/source.mp4"
          docker exec "$video_worker_id" mkdir -p "/media/videos/originals/$smoke_video_id"
          docker exec "$video_worker_id" ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=24 -f lavfi -i sine=frequency=1000:sample_rate=44100 -t 6 -c:v mpeg4 -c:a aac -shortest -y "$smoke_source"
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -v ON_ERROR_STOP=1 -h testagram-postgres -U postgres -d testagram -c "INSERT INTO testagram_video.channels(id,owner_id,handle,name) VALUES ('$smoke_channel_id','$smoke_owner_id','ci-video-$smoke_video_id','CI video smoke'); INSERT INTO testagram_video.videos(id,channel_id,owner_id,title,visibility,status,original_object_key,original_size_bytes) VALUES ('$smoke_video_id','$smoke_channel_id','$smoke_owner_id','CI transcode smoke','public','queued','videos/originals/$smoke_video_id/source.mp4',1); INSERT INTO testagram_video.video_jobs(video_id,kind) VALUES ('$smoke_video_id','transcode'),('$smoke_video_id','poster');"
          smoke_video_status=""
          for i in $(seq 1 90); do
            smoke_video_status="$(docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -At -h testagram-postgres -U postgres -d testagram -c "SELECT status FROM testagram_video.videos WHERE id='$smoke_video_id'")"
            [[ "$smoke_video_status" == ready ]] && break
            sleep 2
          done
          [[ "$smoke_video_status" == ready ]] || { docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -h testagram-postgres -U postgres -d testagram -c "SELECT kind,status,attempts,last_error FROM testagram_video.video_jobs WHERE video_id='$smoke_video_id'"; docker compose -f backend/docker-compose.yml logs --no-color video-worker; echo "::error::Video worker did not finish the poster and HLS transcode jobs"; exit 1; }
          docker exec "$video_worker_id" test -s "/media/videos/posters/$smoke_video_id/poster.jpg"
          docker exec "$video_worker_id" test -s "/media/videos/hls/$smoke_video_id/master.m3u8"
          docker exec "$video_worker_id" sh -c "find '/media/videos/hls/$smoke_video_id' -type f -name '*.ts' -size +0c | grep -q ."
          # Simulate a worker crash after it claimed the durable cleanup job:
          # an expired lease must be reclaimed, media removed, and the outbox
          # retained as done after the product row and dependent jobs disappear.
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -v ON_ERROR_STOP=1 -h testagram-postgres -U postgres -d testagram -c "BEGIN; INSERT INTO testagram_video.video_media_cleanup_jobs(video_id,status,attempts,lease_until) VALUES ('$smoke_video_id','running',1,now()-interval '1 second'); DELETE FROM testagram_video.videos WHERE id='$smoke_video_id'; DELETE FROM testagram_video.channels WHERE id='$smoke_channel_id'; COMMIT;"
          cleanup_status=""
          for i in $(seq 1 30); do
            cleanup_status="$(docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -At -h testagram-postgres -U postgres -d testagram -c "SELECT status || ':' || attempts FROM testagram_video.video_media_cleanup_jobs WHERE video_id='$smoke_video_id'")"
            [[ "$cleanup_status" == "done:2" ]] && break
            sleep 2
          done
          [[ "$cleanup_status" == "done:2" ]] || { docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine psql -h testagram-postgres -U postgres -d testagram -c "SELECT video_id,status,attempts,lease_until,last_error FROM testagram_video.video_media_cleanup_jobs WHERE video_id='$smoke_video_id'"; docker compose -f backend/docker-compose.yml logs --no-color video-worker; echo "::error::Durable video media cleanup did not reclaim the expired lease and finish"; exit 1; }
          docker exec "$video_worker_id" sh -c "test ! -e '/media/videos/originals/$smoke_video_id' && test ! -e '/media/videos/posters/$smoke_video_id' && test ! -e '/media/videos/hls/$smoke_video_id'"
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine sh -c 'applied="$(psql -h testagram-postgres -U postgres -d testagram -Atqc "SELECT count(*) FROM public.testagram_data_centre_schema_migrations WHERE version = '\''008_video_media_cleanup_outbox.sql'\''")"; test "$applied" = "1"'
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine sh -c "psql -h testagram-postgres -U postgres -d postgres -Atqc \"SELECT 1 FROM pg_database WHERE datname = 'testagram_federation'\" | grep -qx 1"
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - http://127.0.0.1:8092/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - http://127.0.0.1:8092/readyz
          docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - --header="Authorization: Bearer ci-algorithm-internal-token-long-enough" --header="X-Testagram-API-Version: 1" --header="X-Request-ID: ci-ranker-smoke" --header="Content-Type: application/json" --post-data='{"now":"2026-11-10T10:00:00Z","candidates":[{"id":"post-ci","authorId":"user-ci","createdAt":"2026-11-10T09:00:00Z","visible":true,"features":{"quality":0.8}}],"limit":10}' http://127.0.0.1:8092/v1/feed/rank | grep -q 'post-ci'
          docker compose -f backend/docker-compose.yml exec -T federation-api /federation-api --healthcheck
          docker run --rm --network testagram-platform postgres:17-alpine wget -q -O - --header="Accept: application/jrd+json" "http://federation:8081/.well-known/webfinger?resource=acct:testagram@testagram.site" | grep -q 'acct:testagram@testagram.site'
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/readyz
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token-2026-strong" --header="Content-Type: application/json" --post-data='{"key":"ci.flag","enabled":true,"public":true,"value":{"mode":"green"}}' http://127.0.0.1:8095/v1/config/set || { echo "feature-flag write failed; platform logs follow"; docker compose -f backend/docker-compose.yml logs --no-color platform; exit 1; }
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/v1/config/ci.flag | grep -Eq '"mode"[[:space:]]*:[[:space:]]*"green"'
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token-2026-strong" --header="Content-Type: application/json" --post-data='{"event_name":"ci.smoke","properties":{"status":"green"}}' http://127.0.0.1:8095/v1/events
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token-2026-strong" --header="Content-Type: application/json" --post-data='{"action":"ci.smoke","resource_type":"workflow","resource_id":"platform","metadata":{"status":"green"}}' http://127.0.0.1:8095/v1/audit
          docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz
          for i in $(seq 1 30); do
            docker exec testagram-api wget -q -O - http://video:8790/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-api wget -q -O - http://video:8790/readyz
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T notification wget -q -O - http://127.0.0.1:8090/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T notification wget -q -O - http://127.0.0.1:8090/readyz
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T worker wget -q -O - http://127.0.0.1:8091/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T worker wget -q -O - http://127.0.0.1:8091/readyz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate Android VPS runtime sources
        run: |
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaServer.kt
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaService.kt
          grep -q 'android:name=".LocalMediaService"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="specialUse"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android-node/app/src/main/AndroidManifest.xml

      - name: Build Android debug node
        run: gradle -p android-node assembleDebug

      - name: Package Android installers
        run: |
          set -euo pipefail
          mkdir -p android-node/dist
          cp android-node/app/build/outputs/apk/debug/app-debug.apk android-node/dist/TestagramNode-debug.apk
          cp android-node/install-apk.sh android-node/dist/install-apk.sh
          sha256sum android-node/dist/TestagramNode-debug.apk > android-node/dist/TestagramNode-debug.apk.sha256

      - name: Check release signing configuration
        id: release-signing
        env:
          KEYSTORE: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          STORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing is not configured. The debug APK remains available; configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for the signed release APK."
          fi

      - name: Build signed Android release
        if: steps.release-signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-node/ci-release.keystore
          export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/android-node/ci-release.keystore"
          gradle -p android-node assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose android-node/app/build/outputs/apk/release/app-release.apk
          cp android-node/app/build/outputs/apk/release/app-release.apk android-node/dist/TestagramNode-release.apk
          sha256sum android-node/dist/TestagramNode-release.apk > android-node/dist/TestagramNode-release.apk.sha256
          rm -f android-node/ci-release.keystore

      - name: Upload Android packages
        uses: actions/upload-artifact@v6
        with:
          name: testagram-android-node
          path: android-node/dist/
          retention-days: 90

  isolated-restore-drill:
    name: Encrypted database restore drill (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install age CLI
        run: |
          go install filippo.io/age/cmd/age@v1.2.1
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create disposable source databases and encrypted backup fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17-alpine
          restore_image="$(docker image inspect postgres:17-alpine --format '{{index .RepoDigests 0}}')"
          [[ "$restore_image" == postgres@sha256:* ]]
          echo "restore_image=$restore_image" >> "$GITHUB_OUTPUT"

          stage="$(mktemp -d)"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          docker run --detach --name testagram-restore-source \
            --publish 127.0.0.1:54329:5432 \
            --env POSTGRES_PASSWORD=ci-only-password \
            postgres:17-alpine >/dev/null
          for attempt in $(seq 1 45); do
            if docker exec testagram-restore-source pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec testagram-restore-source pg_isready -U postgres -d postgres

          docker exec testagram-restore-source createdb -U postgres data_centre
          docker exec testagram-restore-source psql -U postgres -d data_centre -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE restore_probe(id integer PRIMARY KEY, value text NOT NULL); INSERT INTO restore_probe VALUES (1, 'data-centre-ok');"

          docker exec testagram-restore-source createdb -U postgres media
          docker exec testagram-restore-source psql -U postgres -d media -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE media_objects(id integer PRIMARY KEY); CREATE TABLE media_outbox(id integer PRIMARY KEY); INSERT INTO media_objects VALUES (1); INSERT INTO media_outbox VALUES (1);"

          docker exec testagram-restore-source createdb -U postgres federation
          docker exec testagram-restore-source psql -U postgres -d federation -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE federation_actors(id integer PRIMARY KEY); INSERT INTO federation_actors VALUES (1);"

          for entry in data_centre:data-centre media:media federation:federation; do
            database="${entry%%:*}"
            dump_name="${entry#*:}"
            docker exec testagram-restore-source pg_dump -U postgres -Fc "$database" > "$stage/$dump_name.dump"
            test -s "$stage/$dump_name.dump"
          done

          # Match the production multi-database archive contract.
          (cd "$stage" && sha256sum ./*.dump > components.sha256)
          cat > "$stage/metadata.txt" <<'EOF'
          backup_scope=data_centre_and_service_metadata
          neon_database_required=false
          cross_database_atomic=not_atomic; coordinated_restore_requires_maintenance_window
          media_bytes_included=false
          external_identity_documents_included=false
          media_database_included=true
          federation_database_included=true
          EOF
          tar -czf "$stage/testagram-ci-backup.tar.gz" -C "$stage" data-centre.dump media.dump federation.dump components.sha256 metadata.txt
          age-keygen -o "$stage/restore-identity.txt"
          chmod 600 "$stage/restore-identity.txt"
          recipient="$(age-keygen -y "$stage/restore-identity.txt")"
          age -r "$recipient" -o "$stage/testagram-ci-backup.tar.gz.age" "$stage/testagram-ci-backup.tar.gz"
          (cd "$stage" && sha256sum testagram-ci-backup.tar.gz.age > testagram-ci-backup.tar.gz.age.sha256)
          test -s "$stage/testagram-ci-backup.tar.gz.age"

      - name: Restore encrypted Data Centre archive in network-isolated PostgreSQL
        env:
          STAGE: ${{ steps.fixture.outputs.stage }}
          RESTORE_IMAGE: ${{ steps.fixture.outputs.restore_image }}
        run: |
          set -euo pipefail
          TESTAGRAM_BACKUP_AGE_IDENTITY_FILE="$STAGE/restore-identity.txt" \
          TESTAGRAM_RESTORE_POSTGRES_IMAGE="$RESTORE_IMAGE" \
            bash vps/restore-drill.sh "$STAGE/testagram-ci-backup.tar.gz.age"

      - name: Verify the restore drill left no test containers
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Eq '^testagram-restore-drill-'; then
            echo "A restore-drill container was not cleaned up" >&2
            exit 1
          fi
          docker rm -f testagram-restore-source >/dev/null 2>&1 || true

      - name: Remove encrypted fixture and temporary identity
        if: always()
        env:
          STAGE: ${{ steps.fixture.outputs.stage }}
        run: |
          if [[ -n "${STAGE:-}" && -d "$STAGE" ]]; then
            rm -rf -- "$STAGE"
          fi
