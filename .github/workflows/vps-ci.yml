name: testagram-vps-ci
on:
  push:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","backend/**","vps/**","docs/platform/**","scripts/validate-testagram-platform-contracts.sh","scripts/validate-platform-openapi.py","scripts/migrate-data-centre.sh",".github/workflows/vps-ci.yml"]
  pull_request:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","backend/**","vps/**","docs/platform/**","scripts/validate-testagram-platform-contracts.sh","scripts/validate-platform-openapi.py","scripts/migrate-data-centre.sh",".github/workflows/vps-ci.yml"]
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Test-only immutable-looking references allow Compose model rendering; CI never pulls these API/ranker placeholders.
      TESTAGRAM_BACKEND_IMAGE: ghcr.io/trendyzima/testagram-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TESTAGRAM_ALGORITHM_IMAGE: ghcr.io/trendyzima/testagram-feed:sha-ca585b7fe40cb423d1c5d2f32eb8930ee9558949
      TESTAGRAM_FEDERATION_IMAGE: ghcr.io/trendyzima/testagram-federation:sha-8aa46c04532eab99d533709109c7f86d716cff36
      ALGORITHM_INTERNAL_TOKEN: ci-algorithm-internal-token-long-enough
      FEDERATION_INTERNAL_TOKEN: ci-federation-internal-token-long-enough
      FEDERATION_DATABASE_NAME: testagram_federation
      FEDERATION_DATABASE_URL: postgresql://postgres:testagram@federation-db:5432/testagram_federation?sslmode=disable
      FEDERATION_PUBLIC_BASE_URL: https://federation.testagram.site
      FEDERATION_INSTANCE_DOMAIN: testagram.site
      TESTAGRAM_FRESH_BACKEND_IMAGE: ghcr.io/trendyzima/testagram-backend-fresh@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      CADDY_IMAGE: caddy:2.10-alpine
      POSTGRES_CLIENT_IMAGE: postgres:17-alpine
      DATA_CENTRE_DATABASE_URL: postgresql://postgres:testagram@db:5432/data_centre?sslmode=disable
      # Compose validation fixtures for the independent Data Centre service stack.
      DATABASE_URL: postgresql://postgres:testagram@db:5432/postgres?sslmode=disable
      PLATFORM_INTERNAL_TOKEN: ci-platform-internal-token-long-enough
      VIDEO_SIGNING_SECRET: ci-video-signing-secret-at-least-32-bytes
      NOTIFICATION_INTERNAL_TOKEN: ci-notification-internal-token-long-enough
      APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: ci-project
      APPWRITE_DATABASE_ID: ci-database
      APPWRITE_SERVER_API_KEY: ci-appwrite-server-key
      TESTAGRAM_AUTH_PROVIDER: appwrite
      FRESH_API_ALLOWED_ORIGINS: https://testagram.site,https://www.testagram.site
      FRESH_MEDIA_ENABLED: "false"
      # Non-production credentials used only to render/validate the fresh Compose model in CI.
      # Production must supply one independently generated secret to both Backend and Federation.
      FRESH_FEDERATION_INTERNAL_TOKEN: ci-federation-internal-token-long-enough
      FEDERATION_POSTGRES_IMAGE: postgres:17-alpine
      FEDERATION_DB_PASSWORD: ci-federation-db-password-only
      # Compose interpolation fixture only; CI does not connect Federation to this local URL.
      VPS_INTERNAL_TOKEN: ci-internal-token-for-ci-tests-32chars
      VPS_NODE_BOOTSTRAP_TOKEN: ci-bootstrap-token-for-ci-tests-32chars
      TLS_ADMIN_EMAIL: ci@example.invalid
      # Local Postgres service for CI only; production uses Neon with TLS.
      TESTAGRAM_DATABASE_URL: postgresql://postgres:testagram@db:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Check out canonical Backend source
        uses: actions/checkout@v7
        with:
          repository: Trendyzima/Testagram-backend-
          ref: main
          path: backend-source
          persist-credentials: false
      - name: Verify canonical Backend Federation schema contract
        run: |
          test -f backend-source/migrations/20261110_federation_outbox.sql
          grep -q 'testagram_local.federation_outbox' backend-source/internal/federationoutbox/store.go
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w control-plane node-agent internal backend/services/video backend/services/video-worker
      - name: Verify Go module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./control-plane ./node-agent ./backend/services/video ./backend/services/video-worker ./backend/services/platform
      - name: Validate fresh platform boundary
        run: |
          set -euo pipefail
          bash -n vps/backup.sh
          bash -n vps/restore-drill.sh
          bash scripts/validate-testagram-platform-contracts.sh
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/validate-platform-openapi.py
          bash -n vps/install.sh
          bash -n scripts/install-local-docker.sh
          sh -n scripts/migrate-data-centre.sh
          bash -n android-node/install-apk.sh
          test -f vps/docker-compose.yml
          test -f backend/docker-compose.yml
          test -f vps/fresh/Caddyfile
          grep -q "B2_S3_ENDPOINT" vps/docker-compose.fresh.yml
          grep -q "CLOUDFLARE_R2_ENDPOINT" vps/docker-compose.fresh.yml
          grep -q 'FRESH_MEDIA_ENABLED: ${FRESH_MEDIA_ENABLED:-false}' vps/docker-compose.fresh.yml
          grep -q "TESTAGRAM_RETENTION_ENABLED: \"false\"" vps/docker-compose.fresh.yml
          grep -q "TESTAGRAM_RETENTION_DRY_RUN: \"true\"" vps/docker-compose.fresh.yml
          echo "Fresh runtime, B2/R2 storage contract and disabled-retention gates: PASS"

      - name: Validate database migrations
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testagram \
            -v "$PWD:/workspace:ro" \
            postgres:17-alpine \
            sh -c 'for f in /workspace/migrations/*.sql; do psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"; done'
      - name: Validate Compose syntax
        run: |
          set -euo pipefail
          test -n "$FRESH_FEDERATION_INTERNAL_TOKEN"
          test "${#FRESH_FEDERATION_INTERNAL_TOKEN}" -ge 32
          docker compose -f backend/docker-compose.yml config
          docker compose -f vps/docker-compose.fresh.yml config
          docker compose -f vps/docker-compose.yml config
          cmp -s vps/docker-compose.yml vps/docker-compose.fresh.yml
          ! grep -Eqi "supabase|SUPABASE" vps/docker-compose.yml vps/.env.example vps/install.sh scripts/install-local-docker.sh vps/backup.sh vps/restore-drill.sh backend/docker-compose.yml
          # Both services must receive exactly the same non-empty private credential.
          docker compose --profile federation -f vps/docker-compose.fresh.yml config --format json | python -c 'import json,sys; c=json.load(sys.stdin); api=c["services"]["api"]["environment"]; fed=c["services"]["federation-api"]["environment"]; a=api.get("FRESH_FEDERATION_INTERNAL_TOKEN",""); b=fed.get("BACKEND_INTERNAL_TOKEN",""); assert a and b and a == b, "Backend/Federation private token contract mismatch"'
          ! grep -qi 'supabase' vps/docker-compose.fresh.yml
          ! grep -Eq '/migrations/(002_video_platform|003_production_hardening|004_storage_buckets|005_platform|006_video_upload_safety|007_video_upload_safety)\.sql' vps/docker-compose.fresh.yml
          docker run --rm -e TLS_ADMIN_EMAIL=ci@example.invalid -v "$PWD/vps/fresh/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate VPS control plane runtime
        run: |
          set -euo pipefail
          docker network create testagram-control-plane-ci
          docker run -d --name testagram-control-plane-db --network testagram-control-plane-ci --network-alias db -e POSTGRES_PASSWORD=testagram postgres:17-alpine
          trap 'docker rm -f testagram-control-plane >/dev/null 2>&1 || true; docker rm -f testagram-control-plane-db >/dev/null 2>&1 || true; docker network rm testagram-control-plane-ci >/dev/null 2>&1 || true' EXIT
          trap 'status=$?; echo "Control-plane runtime failed; container state and logs follow"; docker inspect testagram-control-plane --format "{{json .State}}" 2>/dev/null || true; docker logs testagram-control-plane 2>&1 || true; exit "$status"' ERR
          for i in $(seq 1 30); do docker exec testagram-control-plane-db pg_isready -U postgres -d postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec testagram-control-plane-db pg_isready -U postgres -d postgres
          docker run --rm --network testagram-control-plane-ci -e PGPASSWORD=testagram -v "$PWD/migrations:/migrations:ro" postgres:17-alpine sh -c 'psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /migrations/001_vps.sql && psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /migrations/006_hosting_control_plane.sql'
          docker build -f control-plane/Dockerfile -t testagram-control-plane-ci .
          docker run -d --name testagram-control-plane --network testagram-control-plane-ci -p 127.0.0.1:8787:8787 \
            -e DATABASE_URL=postgresql://postgres:testagram@db:5432/postgres?sslmode=disable \
            -e VPS_INTERNAL_TOKEN=ci-internal-token-for-ci-tests-32chars -e VPS_NODE_BOOTSTRAP_TOKEN=ci-bootstrap-token-for-ci-tests-32chars \
            -e TESTAGRAM_BASE_DOMAIN=example.testagram.invalid \
            -e TESTAGRAM_DOMAIN_TARGETS=web=http://web:3000 \
            -e TESTAGRAM_PUBLIC_DNS_TARGET=edge.testagram.invalid \
            -e TESTAGRAM_PUBLIC_ORIGIN_IP=203.0.113.10 \
            -e VPS_CONTROL_PLANE_ADDR=:8787 testagram-control-plane-ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/readyz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/healthz
          # Storage-only Android nodes must never receive compute workloads.
          curl -fsS -o /tmp/android-node-registration.json \
            -H "Authorization: Bearer ci-bootstrap-token-for-ci-tests-32chars" -H "Content-Type: application/json" \
            -d '{"name":"android-storage-only","platform":"android","arch":"arm64","cpuCores":8,"memoryBytes":8589934592,"storageBytes":1000000000000,"freeBytes":1000000000000,"endpoint":"android-storage-only","capabilities":{"storageOnly":true,"storageNode":true,"computeNode":false,"workloadExecution":false,"mediaStorageBytes":1000000000000,"mediaStorageFreeBytes":1000000000000,"microSD":true}}' \
            http://127.0.0.1:8787/v1/nodes/register
          curl -fsS -o /tmp/linux-node-registration.json \
            -H "Authorization: Bearer ci-bootstrap-token-for-ci-tests-32chars" -H "Content-Type: application/json" \
            -d '{"name":"linux-compute","platform":"linux","arch":"amd64","cpuCores":2,"memoryBytes":8589934592,"storageBytes":10000000000,"freeBytes":5000000000,"endpoint":"linux-compute","capabilities":{"computeNode":true,"storageNode":false,"workloadExecution":true,"mediaStorageBytes":0,"mediaStorageFreeBytes":0}}' \
            http://127.0.0.1:8787/v1/nodes/register
          curl -fsS -o /tmp/scheduled-workload.json \
            -H "Authorization: Bearer ci-internal-token-for-ci-tests-32chars" -H "Content-Type: application/json" \
            -d '{"image":"ghcr.io/example/test","imageDigest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","command":["true"],"cpuMillis":100,"memoryBytes":67108864}' \
            http://127.0.0.1:8787/v1/workloads
          grep -q '"endpoint":"linux-compute"' /tmp/scheduled-workload.json
          auth_header="Authorization: Bearer ci-internal-token-for-ci-tests-32chars"
          curl -fsS -H "$auth_header" http://127.0.0.1:8787/v1/hosting/health | grep -q '"status":"ok"'
          domain_code="$(curl -sS -o /tmp/testagram-domain.json -w '%{http_code}' -H "$auth_header" -H 'Content-Type: application/json' -d '{"slug":"demo-app","targetService":"web"}' http://127.0.0.1:8787/v1/hosting/domains)"
          test "$domain_code" = "201"
          grep -q 'demo-app.example.testagram.invalid' /tmp/testagram-domain.json
          curl -fsS -H "$auth_header" http://127.0.0.1:8787/v1/hosting/dns/records | grep -q 'demo-app.example.testagram.invalid'
          curl -fsS -H "$auth_header" http://127.0.0.1:8787/v1/hosting/nodes >/dev/null
          curl -fsS -H "$auth_header" http://127.0.0.1:8787/v1/hosting/usage >/dev/null
          register_code="$(curl -sS -o /tmp/testagram-node.json -w '%{http_code}' -H 'Authorization: Bearer ci-bootstrap-token-for-ci-tests-32chars' -H 'Content-Type: application/json' -d '{"name":"ci-node","platform":"linux","arch":"amd64","cpuCores":2,"memoryBytes":2147483648,"storageBytes":10737418240,"freeBytes":8589934592,"endpoint":"ci-node","capabilities":{}}' http://127.0.0.1:8787/v1/nodes/register)"
          test "$register_code" = "201"
          deploy_code="$(curl -sS -o /tmp/testagram-deployment.json -w '%{http_code}' -H "$auth_header" -H 'Content-Type: application/json' -d '{"appName":"ci-demo","image":"registry.example/testagram-demo","imageDigest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","arch":"amd64","cpuMillis":100,"memoryBytes":134217728,"storageBytes":134217728,"publicEnv":{"APP_MODE":"ci"},"command":["/bin/true"],"volume":"ci-volume"}' http://127.0.0.1:8787/v1/hosting/deployments)"
          test "$deploy_code" = "201"
          grep -q '"status":"assigned"' /tmp/testagram-deployment.json
          overcommit_code="$(curl -sS -o /tmp/testagram-overcommit.json -w '%{http_code}' -H "$auth_header" -H 'Content-Type: application/json' -d '{"appName":"ci-heavy","image":"registry.example/testagram-heavy","imageDigest":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","arch":"amd64","cpuMillis":1950,"memoryBytes":134217728,"storageBytes":134217728,"command":["/bin/true"]}' http://127.0.0.1:8787/v1/hosting/deployments)"
          test "$overcommit_code" = "503"
          grep -q 'no healthy node has sufficient unreserved CPU' /tmp/testagram-overcommit.json
          backup_hash="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          curl -fsS -H "$auth_header" -H 'Content-Type: application/json' -d "{\"kind\":\"full\",\"storageUri\":\"s3://ci-backups/test/full.tar\",\"sha256\":\"$backup_hash\",\"sizeBytes\":123,\"sourceHost\":\"ci\"}" http://127.0.0.1:8787/v1/hosting/backups > /tmp/testagram-backup.json
          backup_id="$(python -c 'import json; print(json.load(open("/tmp/testagram-backup.json"))["id"])')"
          curl -fsS -H "$auth_header" -H 'Content-Type: application/json' -d "{\"observedSha256\":\"$backup_hash\",\"observedBytes\":123}" "http://127.0.0.1:8787/v1/hosting/backups/$backup_id/verify" | grep -q '"status":"verified"'
          drill_code="$(curl -sS -o /tmp/testagram-drill.json -w '%{http_code}' -H "$auth_header" -H 'Content-Type: application/json' -d "{\"backupId\":\"$backup_id\",\"targetId\":\"ci-isolated-target\",\"restoredSha256\":\"$backup_hash\",\"success\":false,\"notes\":\"Contract test: deliberately reported failure; no restore was attempted.\",\"startedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"completedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" http://127.0.0.1:8787/v1/hosting/recovery/drills)"
          test "$drill_code" = "422"
          grep -q '"success":false' /tmp/testagram-drill.json

      - name: Validate Caddy syntax
        run: |
          if grep -Eq '^[[:space:]]*federation[.]testagram[.]site[[:space:]]*[{]' vps/fresh/Caddyfile; then
            echo "Public Federation routing is blocked until inbox/outbox workers and end-to-end gates are complete."
            exit 1
          fi
          docker run --rm \
            -e TESTAGRAM_DOMAIN=video.testagram.local \
            -e TESTAGRAM_ORIGIN=http://control-plane:8787 \
            -e TLS_ADMIN_EMAIL=admin@testagram.local \
            -e TESTAGRAM_API_DOMAIN=api.testagram.local \
            -v "$PWD/vps/fresh/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Build backend containers
        run: |
          docker compose -f backend/docker-compose.yml build platform video video-worker notification worker
      - name: Backend runtime smoke test
        run: |
          set -euo pipefail
          docker network create testagram-platform 2>/dev/null || true
          docker network create testagram-egress 2>/dev/null || true
          docker run -d --name testagram-postgres --network testagram-platform --network-alias federation-db -e POSTGRES_PASSWORD=testagram postgres:17-alpine
          trap 'docker rm -f testagram-api testagram-postgres >/dev/null 2>&1 || true; docker compose -f backend/docker-compose.yml down -v >/dev/null 2>&1 || true; docker network rm testagram-egress testagram-platform >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            docker exec testagram-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-postgres pg_isready -U postgres -d postgres
          docker exec testagram-postgres createdb -U postgres testagram
          # Backend migrations grant privileges to the application role. Provision it in the
          # clean CI database before applying the canonical Backend migrations.
          docker exec testagram-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DO $role$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''testagram_app'') THEN CREATE ROLE testagram_app NOLOGIN; END IF; END $role$;'
          for migration in backend-source/migrations/*.sql; do
            docker exec -i testagram-postgres psql -U postgres -d testagram -v ON_ERROR_STOP=1 < "$migration"
          done
          docker exec testagram-postgres psql -U postgres -d testagram -Atqc "SELECT to_regclass('testagram_local.federation_outbox') IS NOT NULL AND to_regclass('testagram_local.communication_outbox') IS NOT NULL" | grep -qx t
          docker build -f backend-source/Dockerfile -t testagram-backend-ci backend-source
          export DATABASE_URL=postgresql://postgres:testagram@testagram-postgres:5432/testagram
          export VIDEO_JWT_SECRET=ci-test-jwt-secret
          export VIDEO_SIGNING_SECRET=ci-test-signing-secret-at-least-32-bytes
          export NOTIFICATION_JWT_SECRET=ci-test-jwt-secret
          export NOTIFICATION_INTERNAL_TOKEN=ci-test-internal-token
          export PLATFORM_INTERNAL_TOKEN=ci-platform-internal-token
          export TESTAGRAM_NETWORK=testagram-platform
          docker run -d --name testagram-api --network testagram-platform --network-alias api \
            -e LISTEN_ADDR=:8080 \
            -e DATABASE_URL=postgresql://postgres:testagram@testagram-postgres:5432/testagram?sslmode=disable \
            -e APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1 -e APPWRITE_PROJECT_ID=ci-project \
            -e ALGORITHM_URL=http://algorithm:8092 -e ALGORITHM_INTERNAL_TOKEN=ci-algorithm-internal-token-long-enough \
            -e FEDERATION_INTERNAL_URL=http://federation:8081 -e FEDERATION_INTERNAL_TOKEN=ci-federation-internal-token-long-enough \
            testagram-backend-ci
          for i in $(seq 1 30); do
            docker exec testagram-api wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-api wget -q -O - http://127.0.0.1:8080/readyz
          docker compose -f backend/docker-compose.yml pull algorithm federation-api
          docker compose -f backend/docker-compose.yml up -d platform video video-worker notification worker algorithm federation-api
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine sh -c 'count="$(psql -h testagram-postgres -U postgres -d testagram -Atqc "SELECT count(*) FROM public.testagram_data_centre_schema_migrations")"; test "$count" = "8"'
          docker run --rm --network testagram-platform -e PGPASSWORD=testagram postgres:17-alpine sh -c "psql -h testagram-postgres -U postgres -d postgres -Atqc \"SELECT 1 FROM pg_database WHERE datname = 'testagram_federation'\" | grep -qx 1"
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - http://127.0.0.1:8092/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - http://127.0.0.1:8092/readyz
          docker compose -f backend/docker-compose.yml exec -T algorithm wget -q -O - --header="Authorization: Bearer ci-algorithm-internal-token-long-enough" --header="X-Testagram-API-Version: 1" --header="X-Request-ID: ci-ranker-smoke" --header="Content-Type: application/json" --post-data='{"now":"2026-11-10T10:00:00Z","candidates":[{"id":"post-ci","authorId":"user-ci","createdAt":"2026-11-10T09:00:00Z","visible":true,"features":{"quality":0.8}}],"limit":10}' http://127.0.0.1:8092/v1/feed/rank | grep -q 'post-ci'
          docker compose -f backend/docker-compose.yml exec -T federation-api /federation-api --healthcheck
          docker run --rm --network testagram-platform postgres:17-alpine wget -q -O - --header="Accept: application/jrd+json" "http://federation:8081/.well-known/webfinger?resource=acct:testagram@testagram.site" | grep -q 'acct:testagram@testagram.site'
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/readyz
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"key":"ci.flag","enabled":true,"public":true,"value":{"mode":"green"}}' http://127.0.0.1:8095/v1/config/set || { echo "feature-flag write failed; platform logs follow"; docker compose -f backend/docker-compose.yml logs --no-color platform; exit 1; }
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/v1/config/ci.flag | grep -Eq '"mode"[[:space:]]*:[[:space:]]*"green"'
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"event_name":"ci.smoke","properties":{"status":"green"}}' http://127.0.0.1:8095/v1/events
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"action":"ci.smoke","resource_type":"workflow","resource_id":"platform","metadata":{"status":"green"}}' http://127.0.0.1:8095/v1/audit
          docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz
          docker compose -f backend/docker-compose.yml exec -T notification wget -q -O - http://127.0.0.1:8090/readyz
          docker compose -f backend/docker-compose.yml exec -T worker wget -q -O - http://127.0.0.1:8091/readyz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate Android VPS runtime sources
        run: |
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaServer.kt
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaService.kt
          grep -q 'android:name=".LocalMediaService"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="specialUse"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android-node/app/src/main/AndroidManifest.xml

      - name: Build Android debug node
        run: gradle -p android-node assembleDebug

      - name: Package Android installers
        run: |
          set -euo pipefail
          mkdir -p android-node/dist
          cp android-node/app/build/outputs/apk/debug/app-debug.apk android-node/dist/TestagramNode-debug.apk
          cp android-node/install-apk.sh android-node/dist/install-apk.sh
          sha256sum android-node/dist/TestagramNode-debug.apk > android-node/dist/TestagramNode-debug.apk.sha256

      - name: Check release signing configuration
        id: release-signing
        env:
          KEYSTORE: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          STORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing is not configured. The debug APK remains available; configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for the signed release APK."
          fi

      - name: Build signed Android release
        if: steps.release-signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-node/ci-release.keystore
          export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/android-node/ci-release.keystore"
          gradle -p android-node assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose android-node/app/build/outputs/apk/release/app-release.apk
          cp android-node/app/build/outputs/apk/release/app-release.apk android-node/dist/TestagramNode-release.apk
          sha256sum android-node/dist/TestagramNode-release.apk > android-node/dist/TestagramNode-release.apk.sha256
          rm -f android-node/ci-release.keystore

      - name: Upload Android packages
        uses: actions/upload-artifact@v6
        with:
          name: testagram-android-node
          path: android-node/dist/
          retention-days: 90
