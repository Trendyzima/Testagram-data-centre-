name: testagram-vps-ci
on:
  push:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","backend/**","vps/**","docs/platform/**","scripts/validate-testagram-platform-contracts.sh","scripts/validate-testagram-runtime-integration.py","scripts/validate-platform-openapi.py","scripts/migrate-data-centre.sh",".github/workflows/vps-ci.yml",".github/workflows/media-provider-smoke.yml",".github/workflows/media-provider-staging-acceptance.yml",".github/workflows/media-provider-staging-acceptance.yml",".github/workflows/publish-runtime-images.yml"]
  pull_request:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","backend/**","vps/**","docs/platform/**","scripts/validate-testagram-platform-contracts.sh","scripts/validate-testagram-runtime-integration.py","scripts/validate-platform-openapi.py","scripts/migrate-data-centre.sh",".github/workflows/vps-ci.yml",".github/workflows/media-provider-smoke.yml"]
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Test-only immutable-looking references allow Compose model rendering; CI never pulls these API/ranker placeholders.
      TESTAGRAM_BACKEND_IMAGE: ghcr.io/trendyzima/testagram-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TESTAGRAM_ALGORITHM_IMAGE: ghcr.io/trendyzima/testagram-feed:sha-ca585b7fe40cb423d1c5d2f32eb8930ee9558949
      TESTAGRAM_FEDERATION_IMAGE: ghcr.io/trendyzima/testagram-federation:sha-8aa46c04532eab99d533709109c7f86d716cff36
      TESTAGRAM_VIDEO_IMAGE: testagram-video-ci:ci
      TESTAGRAM_VIDEO_WORKER_IMAGE: testagram-video-worker-ci:ci
      TESTAGRAM_MEDIA_IMAGE: testagram-media-ci:ci
      ALGORITHM_INTERNAL_TOKEN: ci-algorithm-internal-token-long-enough
      FEDERATION_INTERNAL_URL: http://federation-api:8081
      FEDERATION_INTERNAL_TOKEN: ci-federation-ingress-token-long-enough
      FEDERATION_BACKEND_INTERNAL_TOKEN: ci-federation-backend-read-token-long-enough
      FEDERATION_INGRESS_TOKEN: ci-federation-ingress-token-long-enough
      FEDERATION_INBOX_ACCEPT_ENABLED: "false"
      FEDERATION_DATABASE_NAME: testagram_federation
      FEDERATION_DATABASE_USER: testagram_federation_ci
      FEDERATION_DATABASE_PASSWORD: ci-federation-db-password-only
      FEDERATION_DATABASE_URL: postgresql://testagram_federation_ci:ci-federation-db-password-only@federation-db:5432/testagram_federation?sslmode=disable
      FEDERATION_PUBLIC_BASE_URL: https://testagram.site
      FEDERATION_INSTANCE_DOMAIN: testagram.site
      CADDY_IMAGE: caddy:2.10-alpine
      POSTGRES_CLIENT_IMAGE: postgres:17-alpine
      DATA_CENTRE_DATABASE_URL: postgresql://postgres:testagram@db:5432/data_centre?sslmode=disable
      # Compose validation fixtures for the independent Data Centre service stack.
      DATABASE_URL: postgresql://postgres:testagram@db:5432/postgres?sslmode=disable
      PLATFORM_INTERNAL_TOKEN: ci-platform-internal-token-2026-strong
      VIDEO_SIGNING_SECRET: ci-video-signing-secret-at-least-32-bytes
      NOTIFICATION_INTERNAL_TOKEN: ci-notification-internal-token-long-enough
      TESTAGRAM_AUTH_JWT_SECRET: ci-testagram-native-auth-secret-at-least-32-bytes
      ALLOWED_ORIGINS: https://testagram.site,https://www.testagram.site
      AUTH_PUBLIC_BASE_URL: https://testagram.site
      FRESH_MEDIA_ENABLED: "false"
      DATA_CENTRE_MEDIA_API_URL: http://media:8096
      FRESH_DATA_CENTRE_INTERNAL_TOKEN: ci-media-internal-token-at-least-32-chars
      IDENTITY_EVIDENCE_DATA_CENTRE_INTERNAL_TOKEN: ci-identity-evidence-service-token-0123456789
      MEDIA_DATABASE_NAME: media
      MEDIA_DATABASE_USER: testagram_media_ci
      MEDIA_DATABASE_PASSWORD: ci-media-db-password-only
      MEDIA_DATABASE_URL: postgresql://testagram_media_ci:ci-media-db-password-only@db:5432/media?sslmode=disable
      B2_S3_ENDPOINT: https://s3.us-west-004.backblazeb2.com
      B2_S3_REGION: us-west-004
      B2_S3_BUCKET: ci-media-primary
      B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ci-identity-evidence-b2
      B2_S3_ACCESS_KEY_ID: ci-b2-access
      B2_S3_SECRET_ACCESS_KEY: ci-b2-secret
      CLOUDFLARE_R2_ENDPOINT: https://ci-account.r2.cloudflarestorage.com
      CLOUDFLARE_R2_REGION: auto
      CLOUDFLARE_R2_BUCKET: ci-media-replica
      CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ci-identity-evidence-r2
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci-r2-access
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci-r2-secret
      CLOUDFLARE_R2_METADATA_BUCKET: ci-media-metadata-replica
      VPS_MINIO_ENDPOINT: http://object-storage:9000
      VPS_MINIO_REGION: us-east-1
      VPS_MINIO_METADATA_BUCKET: ci-media-metadata-primary
      VPS_MINIO_METADATA_ACCESS_KEY_ID: ci-minio-access
      VPS_MINIO_METADATA_SECRET_ACCESS_KEY: ci-minio-secret
      FEDERATION_POSTGRES_IMAGE: postgres:17-alpine
      FEDERATION_DB_PASSWORD: ci-federation-db-password-only
      # Compose interpolation fixture only; CI does not connect Federation to this local URL.
      VPS_INTERNAL_TOKEN: ci-internal-token-for-ci-tests-32chars
      VPS_NODE_BOOTSTRAP_TOKEN: ci-bootstrap-token-for-ci-tests-32chars
      TLS_ADMIN_EMAIL: ci@example.invalid
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Check out canonical Backend source
        uses: actions/checkout@v7
        with:
          repository: Trendyzima/Testagram-backend-
          ref: f810c5aab55c4642a3386c6fdc0d5630bb7037c5
          path: backend-source
          persist-credentials: false
      - name: Verify canonical Backend Federation schema contract
        run: |
          test -f backend-source/migrations/20261110_federation_outbox.sql
          grep -q 'testagram_local.federation_outbox' backend-source/internal/federationoutbox/store.go
      - name: Verify deferred canonical Backend migration prerequisites
        run: |
          test -f backend-source/migrations/061_native_sensitive_action_integrity.sql
          test -f backend-source/migrations/062_testagram_knowledge_engine.sql
          test -f backend-source/migrations/064_knowledge_topic_seed_catalog.sql
          test -f backend-source/migrations/20261115_testagram_native_auth_cutover_foundation.sql
          test -f backend-source/migrations/20261118_native_admin_console.sql
          test -f backend-source/migrations/20261121_native_staff_webauthn.sql
          test -f backend-source/migrations/20261120_native_verification_decider.sql
          test -f backend-source/migrations/20261120_native_identity_historical_attribution_archive.sql
          grep -Fq 'video-private: {}' backend-source/deploy/self-hosted/docker-compose.yml
          grep -Fq 'networks: [edge, control-plane, platform]' backend-source/deploy/self-hosted/docker-compose.yml
          grep -Fq 'if [ "$migration" = "backend-source/migrations/061_native_sensitive_action_integrity.sql" ]; then' .github/workflows/vps-ci.yml
          grep -Fq 'if [ "$migration" = "backend-source/migrations/062_testagram_knowledge_engine.sql" ]; then' .github/workflows/vps-ci.yml
          grep -Fq 'if [ "$migration" = "backend-source/migrations/064_knowledge_topic_seed_catalog.sql" ]; then' .github/workflows/vps-ci.yml
          grep -Fq 'if [ "$migration" = "backend-source/migrations/20261120_native_identity_historical_attribution_archive.sql" ]; then' .github/workflows/vps-ci.yml
          grep -Fq 'if [ "$migration" = "backend-source/migrations/20261120_native_verification_decider.sql" ]; then' .github/workflows/vps-ci.yml
      - name: Set up canonical Backend Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Test canonical Backend TV monitor OIDC and route guards
        run: |
          cd backend-source
          go test ./cmd/api -run 'TestVerifyTVGitHubOIDCToken|TestValidTVHealthInput|TestTVCatalogRouteRequiresAuthorizedWorkflowIdentity|TestTVHealthRouteRequiresAuthorizedWorkflowIdentity'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w control-plane node-agent internal backend/internal/nativeauth backend/services/video backend/services/notification backend/services/video-worker backend/services/media
      - name: Verify Go module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Guard live B2/R2 lifecycle acceptance workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow_path = Path(".github/workflows/media-provider-smoke.yml")
          assert not workflow_path.exists(), "obsolete staging-only live provider smoke workflow must remain removed"
          compose = Path("backend/docker-compose.yml").read_text()
          provisioner = Path("scripts/provision-media-database.sh").read_text()
          media_acceptance = Path(".github/workflows/media-provider-staging-acceptance.yml").read_text()
          assert "B2 and R2 staging endpoints must resolve to distinct hostnames" in media_acceptance, "provider acceptance must reject a shared B2/R2 endpoint"
          assert 'entrypoint: ["/bin/sh", "/scripts/provision-media-database.sh"]' in compose, "deployment media-migrate must execute the mounted database provisioner"
          assert "../scripts/provision-media-database.sh:/scripts/provision-media-database.sh:ro" in compose, "deployment media-migrate must mount the provisioner read-only"
          assert 'psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_media_lifecycle.sql' in provisioner, "media provisioner must apply the lifecycle migration"
          assert 'psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/002_primary_origin_restore.sql' in provisioner, "media provisioner must apply the primary restoration migration"
          assert 'psql "$MEDIA_DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/003_identity_evidence_namespace.sql' in provisioner, "media provisioner must apply the isolated identity evidence namespace migration"
          PY
      - run: go build ./control-plane ./node-agent ./backend/services/video ./backend/services/video-worker ./backend/services/platform ./backend/services/media

      - name: Exercise isolated media database bootstrap and least-privilege role
        shell: bash
        run: |
          set -euo pipefail
          network="${TESTAGRAM_PLATFORM_NETWORK:-testagram-platform}"
          docker network create "$network"
          cleanup() {
            docker rm -f testagram-media-migrate-db >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name testagram-media-migrate-db --network "$network" \
            --network-alias db --network-alias postgres --network-alias federation-db \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=testagram -e POSTGRES_DB=postgres \
            postgres:17-alpine
          for attempt in $(seq 1 40); do
            if docker exec testagram-media-migrate-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then echo "::error::CI PostgreSQL did not become healthy"; exit 1; fi
            sleep 2
          done
          docker compose -p testagram-media-migrate-ci -f backend/docker-compose.yml --profile media run --rm --no-deps media-migrate
          role_attrs="$(docker exec testagram-media-migrate-db psql -U postgres -d postgres -Atqc "SELECT (rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls)::text FROM pg_roles WHERE rolname = 'testagram_media_ci'")"
          [[ "$role_attrs" == "true" ]] || { echo "::error::Media database role must be login-capable without superuser, database-creation, role-creation, replication or bypass-RLS privileges: $role_attrs"; exit 1; }
          db_owner="$(docker exec testagram-media-migrate-db psql -U postgres -d postgres -Atqc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'media'")"
          [[ "$db_owner" == "testagram_media_ci" ]] || { echo "::error::Media database owner mismatch: $db_owner"; exit 1; }
          docker run --rm --network "$network" -e PGPASSWORD="$MEDIA_DATABASE_PASSWORD" postgres:17-alpine \
            psql -h db -U "$MEDIA_DATABASE_USER" -d media -v ON_ERROR_STOP=1 -Atqc "SELECT current_user || ':' || current_database()" | grep -qx 'testagram_media_ci:media'
          docker exec testagram-media-migrate-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.admin_only_media_probe(secret text); INSERT INTO public.admin_only_media_probe VALUES ('private'); REVOKE ALL ON public.admin_only_media_probe FROM PUBLIC" >/dev/null
          if docker run --rm --network "$network" -e PGPASSWORD="$MEDIA_DATABASE_PASSWORD" postgres:17-alpine \
            psql -h db -U "$MEDIA_DATABASE_USER" -d postgres -v ON_ERROR_STOP=1 -c "SELECT * FROM public.admin_only_media_probe" >/dev/null 2>&1; then
            echo "::error::Media database role unexpectedly read Backend administrative database"
            exit 1
          fi
          echo "Media migration creates a dedicated non-superuser database owner; runtime credentials cannot read the Backend administrative database."
          docker run --rm --network "$network" \
            -e DATABASE_URL="postgresql://postgres:testagram@db:5432/postgres?sslmode=disable" \
            -e FEDERATION_DATABASE_NAME=testagram_federation \
            -e FEDERATION_DATABASE_USER=testagram_federation_ci \
            -e FEDERATION_DATABASE_PASSWORD=ci-federation-db-password-only \
            -v "$PWD/scripts/provision-federation-database.sh:/scripts/provision-federation-database.sh:ro" \
            postgres:17-alpine /bin/sh /scripts/provision-federation-database.sh
          federation_role_attrs="$(docker exec testagram-media-migrate-db psql -U postgres -d postgres -Atqc "SELECT (rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls)::text FROM pg_roles WHERE rolname = 'testagram_federation_ci'")"
          [[ "$federation_role_attrs" == "true" ]] || { echo "::error::Federation database role must be login-capable without superuser, database-creation, role-creation, replication or bypass-RLS privileges: $federation_role_attrs"; exit 1; }
          federation_db_owner="$(docker exec testagram-media-migrate-db psql -U postgres -d postgres -Atqc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'testagram_federation'")"
          [[ "$federation_db_owner" == "testagram_federation_ci" ]] || { echo "::error::Federation database owner mismatch: $federation_db_owner"; exit 1; }
          docker run --rm --network "$network" -e PGPASSWORD=ci-federation-db-password-only postgres:17-alpine \
            psql -h federation-db -U testagram_federation_ci -d testagram_federation -v ON_ERROR_STOP=1 -Atqc "SELECT current_user || ':' || current_database()" | grep -qx 'testagram_federation_ci:testagram_federation'
          if docker run --rm --network "$network" -e PGPASSWORD=ci-federation-db-password-only postgres:17-alpine \
            psql -h federation-db -U testagram_federation_ci -d postgres -v ON_ERROR_STOP=1 -c "SELECT * FROM public.admin_only_media_probe" >/dev/null 2>&1; then
            echo "::error::Federation database role unexpectedly read Backend administrative database"
            exit 1
          fi
          echo "Federation protocol state uses a dedicated non-superuser database owner, isolated from Backend product tables."
          # Reproduce the production failure: a pre-existing local_actors table
          # owned by the old Backend migration role must be transferred before
          # the Federation runtime's ALTER TABLE schema initialization.
          docker exec testagram-media-migrate-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE federation_legacy_migration LOGIN PASSWORD 'ci-legacy-owner-password'" >/dev/null
          docker exec testagram-media-migrate-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE testagram_federation_legacy OWNER federation_legacy_migration" >/dev/null
          docker run --rm --network "$network" -e PGPASSWORD=ci-legacy-owner-password postgres:17-alpine \
            psql -h federation-db -U federation_legacy_migration -d testagram_federation_legacy -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE public.local_actors(id text PRIMARY KEY, actor_uri text NOT NULL); INSERT INTO public.local_actors VALUES ('ci-actor','https://testagram.site/users/ci')" >/dev/null
          # The Backend administrator also owns objects outside the Federation
          # schema (including shared/system objects). The provisioner must not
          # use REASSIGN OWNED against that role to move one public table.
          docker exec testagram-media-migrate-db psql -U postgres -d testagram_federation_legacy -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE public.backend_admin_owned_probe(id integer PRIMARY KEY)" >/dev/null
          docker run --rm --network "$network" \
            -e DATABASE_URL="postgresql://postgres:testagram@db:5432/postgres?sslmode=disable" \
            -e FEDERATION_DATABASE_NAME=testagram_federation_legacy \
            -e FEDERATION_DATABASE_USER=testagram_federation_legacy_ci \
            -e FEDERATION_DATABASE_PASSWORD=ci-federation-legacy-db-password \
            -v "$PWD/scripts/provision-federation-database.sh:/scripts/provision-federation-database.sh:ro" \
            postgres:17-alpine /bin/sh /scripts/provision-federation-database.sh
          legacy_owner="$(docker run --rm --network "$network" -e PGPASSWORD=ci-federation-legacy-db-password postgres:17-alpine \
            psql -h federation-db -U testagram_federation_legacy_ci -d testagram_federation_legacy -Atqc "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid='public.local_actors'::regclass")"
          [[ "$legacy_owner" == "testagram_federation_legacy_ci" ]] || { echo "::error::Legacy local_actors ownership was not transferred: $legacy_owner"; exit 1; }
          admin_owned_table_owner="$(docker run --rm --network "$network" -e PGPASSWORD=ci-federation-legacy-db-password postgres:17-alpine \
            psql -h federation-db -U testagram_federation_legacy_ci -d testagram_federation_legacy -Atqc "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid='public.backend_admin_owned_probe'::regclass")"
          [[ "$admin_owned_table_owner" == "testagram_federation_legacy_ci" ]] || { echo "::error::Backend-admin-owned public table was not transferred: $admin_owned_table_owner"; exit 1; }
          docker run --rm --network "$network" -e PGPASSWORD=ci-federation-legacy-db-password postgres:17-alpine \
            psql -h federation-db -U testagram_federation_legacy_ci -d testagram_federation_legacy -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE public.local_actors ADD COLUMN schema_repair_verified boolean NOT NULL DEFAULT true; ALTER TABLE public.backend_admin_owned_probe ADD COLUMN schema_repair_verified boolean NOT NULL DEFAULT true" >/dev/null
          echo "Legacy and Backend-admin-owned public object transfer plus Federation runtime ALTER TABLE permission: PASS."
      - name: Validate canonical Backend platform boundary
        run: |
          set -euo pipefail
          bash -n vps/backup.sh
          bash -n vps/restore-drill.sh
          python3 scripts/test-backup-scope-contract.py
          bash scripts/validate-testagram-platform-contracts.sh
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/validate-testagram-runtime-integration.py
          python scripts/validate-platform-openapi.py
          python3 - <<'PY'
          from pathlib import Path
          compose = Path("backend/docker-compose.yml").read_text()
          worker = compose.split("  video-worker:", 1)[1].split("\n  notification:", 1)[0]
          assert "healthcheck:" in worker
          assert '"/usr/local/bin/testagram-video-worker", "--healthcheck"' in worker
          source = Path("backend/services/video-worker/main.go").read_text()
          assert 'os.Args[1] == "--healthcheck"' in source
          assert "db.Ping(ctx)" in source
          assert "os.CreateTemp(root" in source
          PY
          bash -n vps/install.sh
          bash -n scripts/install-local-docker.sh
          sh -n scripts/migrate-data-centre.sh
          sh -n scripts/provision-federation-database.sh
          bash -n android-node/install-apk.sh
          test -f vps/docker-compose.yml
          test -f backend/docker-compose.yml
          test -f vps/fresh/Caddyfile
          grep -q "B2_S3_ENDPOINT" vps/docker-compose.yml
          grep -q "CLOUDFLARE_R2_ENDPOINT" vps/docker-compose.yml
          grep -q 'FRESH_MEDIA_ENABLED: ${FRESH_MEDIA_ENABLED:-false}' vps/docker-compose.yml
          grep -q "TESTAGRAM_RETENTION_ENABLED=false" vps/fresh.env.example
          grep -q "TESTAGRAM_RETENTION_DRY_RUN=true" vps/fresh.env.example
          grep -q 'reverse_proxy api:8080' vps/fresh/Caddyfile
          ! grep -Eqi 'TESTAGRAM_FRESH_BACKEND_IMAGE|FRESH_API_ALLOWED_ORIGINS' vps/docker-compose.yml vps/fresh.env.example vps/.env.example vps/install.sh vps/DEPLOYMENT.md
          grep -q 'TESTAGRAM_BACKEND_IMAGE' vps/docker-compose.yml
          grep -q 'INTERNAL_LISTEN_ADDR: :8082' vps/docker-compose.yml
          grep -Fq 'psql "$MEDIA_DATABASE_URL"' vps/docker-compose.yml
          grep -q '002_primary_origin_restore.sql' vps/docker-compose.yml
          grep -q '003_identity_evidence_namespace.sql' vps/docker-compose.yml
          grep -q 'GET /internal/tv/catalog' backend-source/cmd/api/main.go
          grep -q 'POST /internal/tv/health' backend-source/cmd/api/main.go
          grep -q 'verifyTVGitHubOIDCToken' backend-source/cmd/api/tv_health.go
          grep -q 'githubOIDCAudience = "testagram-tv-health"' backend-source/cmd/api/tv_health.go
          python - <<'PY'
          from pathlib import Path
          compose = Path("backend/docker-compose.yml").read_text()
          env_example = Path("backend/.env.example").read_text()
          federation = compose.split("  federation-api:", 1)[1].split("\n  platform:", 1)[0]
          assert "PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://testagram.site}" in federation, "Federation must advertise the canonical apex origin"
          assert "edge:" in federation and "aliases: [federation]" in federation, "Federation must join the Caddy edge network with the stable federation upstream alias"
          assert "expose: [\"8081\"]" in federation, "Federation must remain private; do not publish a host port"
          assert "FEDERATION_PUBLIC_BASE_URL=https://testagram.site" in env_example, "runtime example must use the canonical apex"
          assert "name: ${TESTAGRAM_EDGE_NETWORK:-testagram-self-hosted_edge}" in compose, "Federation edge network must default to the Backend Caddy network"
          print("Canonical apex Federation overlay and private-edge contract: PASS")
          PY
          echo "Canonical Backend runtime, B2/R2 storage contract and disabled-retention gates: PASS"

      - name: Validate database migrations
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testagram \
            -v "$PWD:/workspace:ro" \
            postgres:17-alpine \
            sh -c 'for f in /workspace/migrations/*.sql; do psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"; done'
          docker run --rm --network host \
            -e PGPASSWORD=testagram \
            -v "$PWD:/workspace:ro" \
            postgres:17-alpine \
