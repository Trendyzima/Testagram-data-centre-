name: testagram-vps-ci
on:
  push:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
  pull_request:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -w control-plane node-agent internal
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./control-plane ./node-agent
      - name: Validate VPS/Supabase boundary
        run: |
          bash -n supabase/bootstrap.sh
          bash -n supabase/prepare.sh
          bash -n supabase/status.sh
          bash -n supabase/healthcheck.sh
          test "$(grep -c '^  - name:' supabase/UPSTREAMS.yaml)" -eq 8
          grep -q 'supabase/postgres.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/auth.git' supabase/UPSTREAMS.yaml
          grep -q 'PostgREST/postgrest.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/realtime.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/storage.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/edge-runtime.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/postgres-meta.git' supabase/UPSTREAMS.yaml
          grep -q 'supabase/supavisor.git' supabase/UPSTREAMS.yaml
          grep -q 'docker-compose.yml:docker-compose.testagram.yml' supabase/prepare.sh
          test -f backend/docker-compose.yml
          test -f backend/runtime/Caddyfile
          test -f backend/services/notification/Dockerfile
          test -f backend/services/worker/Dockerfile
          test -f backend/services/video/Dockerfile
          test -f backend/services/video-worker/Dockerfile
          test -f backend/services/video/main.go
          test -f backend/services/video-worker/main.go
          test -f migrations/002_video_platform.sql
          ! grep -RniE 'youtube|google_youtube' backend supabase/UPSTREAMS.yaml
