name: testagram-vps-ci
on:
  push:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
  pull_request:
    paths: ["go.mod","go.sum","control-plane/**","node-agent/**","internal/**","migrations/**","android-node/**","supabase/**","backend/**",".github/workflows/vps-ci.yml"]
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w control-plane node-agent internal backend/services/video backend/services/video-worker
      - name: Verify Go module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./control-plane ./node-agent ./backend/services/video ./backend/services/video-worker ./backend/services/platform
      - name: Validate VPS/Supabase boundary
        run: |
          set -euo pipefail
          bash -n supabase/bootstrap.sh
          bash -n supabase/prepare.sh
          bash -n supabase/status.sh
          bash -n supabase/healthcheck.sh
          bash -n supabase/storage.sh
          tmp_storage="$(mktemp -d)"
          TESTAGRAM_STORAGE_ROOT="$tmp_storage" bash supabase/storage.sh
          test -d "$tmp_storage/supabase"
          test -d "$tmp_storage/media"
          test -d "$tmp_storage/nodes"
          rm -rf "$tmp_storage"
          bash -n vps/install.sh
          bash -n scripts/install-local-docker.sh
          bash -n android-node/install-apk.sh
          test -f vps/docker-compose.yml
          test -f backend/docker-compose.yml
          test -f backend/runtime/Caddyfile
          echo "VPS local-storage root initialization: PASS"

      - name: Validate database migrations
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testagram \
            -v "$PWD:/workspace:ro" \
            postgres:17-alpine \
            sh -c "psql -h 127.0.0.1 -U postgres -d postgres -f /workspace/migrations/001_vps.sql && psql -h 127.0.0.1 -U postgres -d postgres -f /workspace/migrations/002_video_platform.sql && psql -h 127.0.0.1 -U postgres -d postgres -f /workspace/migrations/003_production_hardening.sql && psql -h 127.0.0.1 -U postgres -d postgres -f /workspace/migrations/004_storage_buckets.sql && psql -h 127.0.0.1 -U postgres -d postgres -f /workspace/migrations/005_platform.sql"
      - name: Validate Compose syntax
        run: |
          docker compose -f backend/docker-compose.yml config
      - name: Validate VPS control plane Compose runtime
        run: |
          set -euo pipefail
          docker network create testagram-supabase 2>/dev/null || true
          docker run -d --name vps-ci-db --network testagram-supabase -e POSTGRES_PASSWORD=testagram postgres:17-alpine
          trap 'docker rm -f vps-ci-db >/dev/null 2>&1 || true; docker compose -f vps/docker-compose.yml down -v >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do docker exec vps-ci-db pg_isready -U postgres -d postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec vps-ci-db pg_isready -U postgres -d postgres
          POSTGRES_PASSWORD=testagram JWT_SECRET=ci-jwt ANON_KEY=ci-anon SERVICE_ROLE_KEY=ci-service DASHBOARD_PASSWORD=ci-dashboard VPS_INTERNAL_TOKEN=ci-internal VPS_NODE_BOOTSTRAP_TOKEN=ci-bootstrap VIDEO_JWT_SECRET=ci-jwt VIDEO_SIGNING_SECRET=ci-signing NOTIFICATION_JWT_SECRET=ci-jwt NOTIFICATION_INTERNAL_TOKEN=ci-notify DATABASE_URL=postgresql://postgres:testagram@db:5432/postgres SUPABASE_NETWORK=testagram-supabase docker compose -f vps/docker-compose.yml build control-plane
          POSTGRES_PASSWORD=testagram JWT_SECRET=ci-jwt ANON_KEY=ci-anon SERVICE_ROLE_KEY=ci-service DASHBOARD_PASSWORD=ci-dashboard VPS_INTERNAL_TOKEN=ci-internal VPS_NODE_BOOTSTRAP_TOKEN=ci-bootstrap VIDEO_JWT_SECRET=ci-jwt VIDEO_SIGNING_SECRET=ci-signing NOTIFICATION_JWT_SECRET=ci-jwt NOTIFICATION_INTERNAL_TOKEN=ci-notify DATABASE_URL=postgresql://postgres:testagram@db:5432/postgres SUPABASE_NETWORK=testagram-supabase docker compose -f vps/docker-compose.yml up -d control-plane
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/readyz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/healthz

      - name: Validate Caddy syntax
        run: |
          docker run --rm \
            -e TESTAGRAM_DOMAIN=video.testagram.local \
            -e TESTAGRAM_ORIGIN=http://control-plane:8787 \
            -e TLS_ADMIN_EMAIL=admin@testagram.local \
            -v "$PWD/backend/runtime/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Build backend containers
        run: |
          docker compose -f backend/docker-compose.yml build platform video video-worker notification worker
      - name: Backend runtime smoke test
        run: |
          set -euo pipefail
          docker network create testagram-supabase 2>/dev/null || true
          docker run -d --name testagram-postgres --network testagram-supabase -e POSTGRES_PASSWORD=testagram postgres:17-alpine
          trap 'docker rm -f testagram-postgres >/dev/null 2>&1 || true; docker compose -f backend/docker-compose.yml down -v >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            docker exec testagram-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec testagram-postgres pg_isready -U postgres -d postgres
          docker run --rm --network testagram-supabase -e PGPASSWORD=testagram -v "$PWD/migrations:/migrations:ro" postgres:17-alpine sh -c "psql -h testagram-postgres -U postgres -d postgres -f /migrations/001_vps.sql && psql -h testagram-postgres -U postgres -d postgres -f /migrations/002_video_platform.sql && psql -h testagram-postgres -U postgres -d postgres -f /migrations/003_production_hardening.sql && psql -h testagram-postgres -U postgres -d postgres -f /migrations/004_storage_buckets.sql && psql -h testagram-postgres -U postgres -d postgres -f /migrations/005_platform.sql"
          export DATABASE_URL=postgresql://postgres:testagram@testagram-postgres:5432/postgres
          export VIDEO_JWT_SECRET=ci-test-jwt-secret
          export VIDEO_SIGNING_SECRET=ci-test-signing-secret-at-least-32-bytes
          export NOTIFICATION_JWT_SECRET=ci-test-jwt-secret
          export NOTIFICATION_INTERNAL_TOKEN=ci-test-internal-token
          export PLATFORM_INTERNAL_TOKEN=ci-platform-internal-token
          export SUPABASE_NETWORK=testagram-supabase
          docker compose -f backend/docker-compose.yml up -d platform video notification worker
          for i in $(seq 1 30); do
            docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/readyz
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"key":"ci:cache","value":"green","ttl_seconds":60}' http://127.0.0.1:8095/v1/cache/set
          test "$(docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" "http://127.0.0.1:8095/v1/cache/get?key=ci:cache" | tr -d '\r\n')" = '{"value":"green"}'
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"key":"ci:rate","limit":1,"window_seconds":60}' http://127.0.0.1:8095/v1/rate-limit/check
          test "$(docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"key":"ci:rate","limit":1,"window_seconds":60}' http://127.0.0.1:8095/v1/rate-limit/check | python -c 'import json,sys; print(json.load(sys.stdin)["allowed"])')" = "False"
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"queue":"ci","payload":{"type":"smoke","value":"ok"}}' http://127.0.0.1:8095/v1/queue/enqueue
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"key":"ci.flag","enabled":true,"public":true,"value":{"mode":"green"}}' http://127.0.0.1:8095/v1/config/set
          test "$(docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - http://127.0.0.1:8095/v1/config/ci.flag | tr -d '\r\n')" = '{"mode":"green"}'
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"event_name":"ci.smoke","properties":{"status":"green"}}' http://127.0.0.1:8095/v1/events
          docker compose -f backend/docker-compose.yml exec -T platform wget -q -O - --header="Authorization: Bearer ci-platform-internal-token" --header="Content-Type: application/json" --post-data='{"action":"ci.smoke","resource_type":"workflow","resource_id":"platform","metadata":{"status":"green"}}' http://127.0.0.1:8095/v1/audit
          docker compose -f backend/docker-compose.yml exec -T video wget -q -O - http://127.0.0.1:8790/readyz
          docker compose -f backend/docker-compose.yml exec -T notification wget -q -O - http://127.0.0.1:8090/readyz
          docker compose -f backend/docker-compose.yml exec -T worker wget -q -O - http://127.0.0.1:8091/readyz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate Android VPS runtime sources
        run: |
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaServer.kt
          test -f android-node/app/src/main/java/com/testagram/node/LocalMediaService.kt
          grep -q 'android:name=".LocalMediaService"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="specialUse"' android-node/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android-node/app/src/main/AndroidManifest.xml

      - name: Build Android debug node
        run: gradle -p android-node assembleDebug

      - name: Package Android installers
        run: |
          set -euo pipefail
          mkdir -p android-node/dist
          cp android-node/app/build/outputs/apk/debug/app-debug.apk android-node/dist/TestagramNode-debug.apk
          cp android-node/install-apk.sh android-node/dist/install-apk.sh
          sha256sum android-node/dist/TestagramNode-debug.apk > android-node/dist/TestagramNode-debug.apk.sha256

      - name: Check release signing configuration
        id: release-signing
        env:
          KEYSTORE: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          STORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing is not configured. The debug APK remains available; configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for the signed release APK."
          fi

      - name: Build signed Android release
        if: steps.release-signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-node/ci-release.keystore
          export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/android-node/ci-release.keystore"
          gradle -p android-node assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose android-node/app/build/outputs/apk/release/app-release.apk
          cp android-node/app/build/outputs/apk/release/app-release.apk android-node/dist/TestagramNode-release.apk
          sha256sum android-node/dist/TestagramNode-release.apk > android-node/dist/TestagramNode-release.apk.sha256
          rm -f android-node/ci-release.keystore

      - name: Upload Android packages
        uses: actions/upload-artifact@v6
        with:
          name: testagram-android-node
          path: android-node/dist/
          retention-days: 90
