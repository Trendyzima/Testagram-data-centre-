name: Live media provider smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/services/media/**"
      - ".github/workflows/media-provider-smoke.yml"
  workflow_dispatch:
    inputs:
      confirm_live_provider_writes:
        description: Confirm this run writes and deletes temporary ci-smoke objects in the configured staging buckets.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provider-smoke:
    if: github.event_name == 'push' || inputs.confirm_live_provider_writes == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-media-smoke-password
          POSTGRES_DB: media_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d media_smoke"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TESTAGRAM_LIVE_MEDIA_SMOKE: "true"
      MEDIA_DATABASE_URL: postgresql://postgres:ci-media-smoke-password@127.0.0.1:5432/media_smoke?sslmode=disable
      MEDIA_INTERNAL_TOKEN: ci-live-media-smoke-internal-token-32-characters
      IDENTITY_EVIDENCE_INTERNAL_TOKEN: ci-live-identity-evidence-smoke-token-32-characters
      MEDIA_SMOKE_B2_ENDPOINT: ${{ secrets.MEDIA_SMOKE_B2_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      MEDIA_SMOKE_B2_REGION: ${{ secrets.MEDIA_SMOKE_B2_REGION || secrets.B2_S3_REGION }}
      MEDIA_SMOKE_B2_BUCKET: ${{ secrets.MEDIA_SMOKE_B2_BUCKET || vars.B2_S3_PRIVATE_BUCKET || secrets.B2_S3_BUCKET }}
      MEDIA_SMOKE_B2_ACCESS_KEY_ID: ${{ secrets.MEDIA_SMOKE_B2_ACCESS_KEY_ID || secrets.B2_S3_ACCESS_KEY_ID }}
      MEDIA_SMOKE_B2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SMOKE_B2_SECRET_ACCESS_KEY || secrets.B2_S3_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_R2_ENDPOINT: ${{ secrets.MEDIA_SMOKE_R2_ENDPOINT || vars.CLOUDFLARE_R2_ENDPOINT || secrets.TESTAGRAM_BACKUP_S3_ENDPOINT }}
      MEDIA_SMOKE_R2_REGION: ${{ secrets.MEDIA_SMOKE_R2_REGION || 'auto' }}
      MEDIA_SMOKE_R2_BUCKET: ${{ secrets.MEDIA_SMOKE_R2_BUCKET || vars.CLOUDFLARE_R2_PRIVATE_BUCKET || 'testagram-media-staging-r2' }}
      MEDIA_SMOKE_R2_ACCESS_KEY_ID: ${{ secrets.MEDIA_SMOKE_R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.TESTAGRAM_BACKUP_S3_ACCESS_KEY_ID }}
      MEDIA_SMOKE_R2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SMOKE_R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.TESTAGRAM_BACKUP_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Ensure the isolated R2 smoke bucket exists
        env:
          R2_BUCKET: ${{ env.MEDIA_SMOKE_R2_BUCKET }}
        run: |
          set -euo pipefail
          case "$MEDIA_SMOKE_B2_BUCKET" in *staging*|*smoke*) ;; *) echo "Refusing live provider smoke against a non-staging B2 bucket." >&2; exit 1 ;; esac
          case "$R2_BUCKET" in *staging*|*smoke*) ;; *) echo "Refusing to provision a non-staging R2 bucket." >&2; exit 1 ;; esac
          [[ "$R2_BUCKET" != "testagram-production-backups" ]] || { echo "Refusing to reuse the Restic backup bucket for media smoke." >&2; exit 1; }
          api_ready=false
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::add-mask::$CLOUDFLARE_API_TOKEN"
            status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$RUNNER_TEMP/r2-buckets.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
            if [[ "$status" == "200" ]]; then
              api_ready=true
              if jq -e --arg name "$R2_BUCKET" '.result.buckets[]? | select(.name == $name)' "$RUNNER_TEMP/r2-buckets.json" >/dev/null; then
                echo "R2 staging bucket already exists."
                exit 0
              fi
              create_status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$RUNNER_TEMP/r2-create.json" -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg name "$R2_BUCKET" '{name:$name,locationHint:"apac"}')" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
              if [[ "$create_status" == "200" ]] && jq -e '.success == true' "$RUNNER_TEMP/r2-create.json" >/dev/null; then
                echo "Created isolated R2 staging bucket through Cloudflare API."
                exit 0
              fi
              jq -c '{success,errors:[.errors[]? | {code,message}]}' "$RUNNER_TEMP/r2-create.json" || true
            else
              echo "Cloudflare R2 bucket listing returned HTTP $status; falling back to the existing S3 key pair."
              jq -c '{success,errors:[.errors[]? | {code,message}]}' "$RUNNER_TEMP/r2-buckets.json" || true
            fi
          else
            echo "Cloudflare API credentials unavailable; falling back to the existing R2 S3 key pair."
          fi
          docker run --rm --entrypoint /bin/sh \
            -e R2_ENDPOINT="$MEDIA_SMOKE_R2_ENDPOINT" -e R2_REGION="$MEDIA_SMOKE_R2_REGION" \
            -e R2_BUCKET="$R2_BUCKET" -e R2_ACCESS_KEY_ID="$MEDIA_SMOKE_R2_ACCESS_KEY_ID" \
            -e R2_SECRET_ACCESS_KEY="$MEDIA_SMOKE_R2_SECRET_ACCESS_KEY" \
            ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z -ec '
              mc alias set r2 "$R2_ENDPOINT" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" --api S3v4 --path auto --region "$R2_REGION" >/dev/null
              mc mb --ignore-existing "r2/$R2_BUCKET"
            '
      - name: Verify staging-only provider configuration
        run: |
          set -euo pipefail
          for name in MEDIA_SMOKE_B2_ENDPOINT MEDIA_SMOKE_B2_REGION MEDIA_SMOKE_B2_BUCKET MEDIA_SMOKE_B2_ACCESS_KEY_ID MEDIA_SMOKE_B2_SECRET_ACCESS_KEY MEDIA_SMOKE_R2_ENDPOINT MEDIA_SMOKE_R2_REGION MEDIA_SMOKE_R2_BUCKET MEDIA_SMOKE_R2_ACCESS_KEY_ID MEDIA_SMOKE_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing required GitHub secret: $name" >&2; exit 1; fi
          done
          for bucket in "$MEDIA_SMOKE_B2_BUCKET" "$MEDIA_SMOKE_R2_BUCKET"; do
            case "$bucket" in
              *staging*|*smoke*) ;;
              *) echo "Bucket names must explicitly identify staging/smoke resources; refusing production or ambiguous buckets." >&2; exit 1 ;;
            esac
          done
      - name: Apply isolated media lifecycle migrations
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=ci-media-smoke-password \
            -v "$PWD/backend/services/media/migrations:/migrations:ro" \
            postgres:17-alpine sh -ec '
              until pg_isready -h 127.0.0.1 -U postgres -d media_smoke; do sleep 1; done
              psql -h 127.0.0.1 -U postgres -d media_smoke -v ON_ERROR_STOP=1 -f /migrations/001_media_lifecycle.sql
              psql -h 127.0.0.1 -U postgres -d media_smoke -v ON_ERROR_STOP=1 -f /migrations/002_primary_origin_restore.sql
              psql -h 127.0.0.1 -U postgres -d media_smoke -v ON_ERROR_STOP=1 -f /migrations/003_identity_evidence_namespace.sql
            '
      - name: Verify live B2/R2 provider lifecycle and replication recovery
        run: |
          set -euo pipefail
          go test -count=1 -run "^(TestLiveProviderRoundTrip|TestLiveMediaReplicationRestoreDelete|TestLiveIdentityEvidenceLifecycle)$" -v ./backend/services/media
