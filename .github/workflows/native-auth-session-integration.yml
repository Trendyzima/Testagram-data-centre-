name: Native authentication session integration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/internal/nativeauth/**"
      - ".github/workflows/native-auth-session-integration.yml"
  push:
    branches: [main]
    paths:
      - "backend/internal/nativeauth/**"
      - ".github/workflows/native-auth-session-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-session-authorization:
    name: Native JWT and live PostgreSQL session authorization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
      - name: Verify native JWT, live session, account and provisioning gates
        run: go test -race -count=1 ./backend/internal/nativeauth -run '^TestResolveUserIDEnforcesLiveSessionAndAccountState$' -v
